<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全国列车时刻地图 · 票路</title>
<meta name="description" content="基于铁路全景时刻数据与余票.info 回看的全国列车地图，支持标准/卫星/夜色/线网主题">
<link rel="stylesheet" href="/vendor/leaflet.min.css">
<style>
:root{--bg:#F2F8FA;--card:#fff;--border:#D8E7EC;--text:#0F2E36;--text2:#54727D;--text3:#8CA8B2;--accent:#0F766E;--shadow:0 4px 18px -8px rgba(15,46,54,.3)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input{font-family:inherit}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;background:var(--card);border-bottom:1px solid var(--border);position:relative;z-index:1001}
.brand{font-weight:800;font-size:1.02em;white-space:nowrap}
.brand small{font-weight:500;color:var(--text3);font-size:.68em;margin-left:6px}
.badge{display:inline-block;background:rgba(15,118,110,.1);color:var(--accent);border:1px solid rgba(15,118,110,.25);border-radius:9px;padding:1px 7px;font-size:.63em;vertical-align:middle;margin-left:5px}
.top-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.status{font-size:.74em;color:var(--text2);white-space:nowrap}
.status.warn{color:#B45309}
.btn{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px 11px;font-size:.77em;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.themes{display:flex;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:2px}
.themes button{border:0;background:transparent;color:var(--text2);border-radius:7px;padding:5px 9px;font-size:.74em;cursor:pointer}
.themes button.on{background:var(--accent);color:#fff}
.controls{position:absolute;top:66px;left:12px;right:12px;z-index:1000;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:12px;padding:9px 11px;box-shadow:var(--shadow)}
.controls::-webkit-scrollbar{display:none}
.controls input[type=text],.controls input[type=date]{border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:.8em;outline:none;background:var(--bg);color:var(--text)}
.controls input[type=text]{width:115px}
.controls input[type=date]{width:120px}
.controls input:focus{border-color:var(--accent)}
.controls label{font-size:.75em;color:var(--text2);display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;white-space:nowrap;cursor:pointer;user-select:none}
.controls input[type=checkbox]{accent-color:var(--accent);margin:0}
#timeRange{flex:1 1 120px;min-width:80px;accent-color:var(--accent)}
.clock{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent);min-width:52px;font-size:.95em}
.chips{display:flex;gap:2px;flex:0 0 auto;flex-wrap:nowrap}
.chip{border:1px solid var(--border);background:var(--bg);border-radius:5px;padding:3px 5px;font-size:.68em;cursor:pointer;color:var(--text2);white-space:nowrap}
#map{position:absolute;top:56px;bottom:0;left:0;right:0;background:#E8F1F3}
.theme-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.88) contrast(.92) saturate(.75)}
.theme-rail #map{background:#EDF3F5}
.detail{position:absolute;right:12px;top:126px;width:300px;max-height:calc(100vh - 150px);overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:1000;padding:14px;font-size:.8em}
.detail h3{margin:0 0 8px;font-size:1.08em}
.detail .close{float:right;cursor:pointer;color:var(--text3);border:0;background:none;font-size:1.1em}
.detail .kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--border)}
.detail .kv b{font-weight:600}
.detail .stops{margin-top:10px;padding-left:14px;border-left:2px solid var(--border)}
.detail .stop{padding:3px 0;color:var(--text2)}
.detail .stop.here{color:var(--accent);font-weight:700}
.detail .yp{display:inline-block;margin-top:10px;padding:6px 9px;border-radius:7px;background:rgba(15,118,110,.1);color:var(--accent);text-decoration:none;font-size:.9em}
.detail{width:352px}
.detail .tabs2{display:flex;gap:4px;margin:10px 0 8px;border-bottom:1px solid var(--border)}
.detail .tabs2 button{border:0;background:none;padding:6px 10px;font-size:.85em;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent}
.detail .tabs2 button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.detail table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.9em}
.detail th{position:sticky;top:0;background:var(--card);color:var(--text3);font-weight:600;text-align:left;padding:5px 4px;border-bottom:1px solid var(--border)}
.detail th.num{text-align:right}
.detail td{padding:5px 4px;border-bottom:1px dashed var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail td.num{text-align:right;font-variant-numeric:tabular-nums}
.detail th:first-child,.detail td:first-child{width:40%}
.detail th.num,.detail td.num{width:20%}
.detail tr.cur{background:rgba(245,158,11,.16);font-weight:700}
.detail tr.next{background:rgba(15,118,110,.10)}
.detail tr.past{color:var(--text3)}
.detail td a{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--border)}
.detail .chart{width:100%;height:250px;overflow:auto;background:var(--bg);border-radius:8px}
.detail .chart svg{display:block}
.detail .tools{display:flex;gap:6px;margin-top:8px}
.detail .tools button{flex:1;border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:6px 4px;font-size:.85em;cursor:pointer;color:var(--text2)}
.detail .tools button:hover{border-color:var(--accent);color:var(--accent)}
.detail .tools button.follow-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:0 0 auto;padding:3px 8px}
.detail .tools button.follow-btn svg{width:28px;height:22px;flex:0 0 28px}
.detail .tools button.follow-btn.on{border-color:var(--accent);background:rgba(15,118,110,.12);color:var(--accent)}
.controls select{border:1px solid var(--border);border-radius:8px;padding:6px 6px;font-size:.78em;background:var(--bg);color:var(--text);outline:none}
.speed-wrap{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.speed-cap{font-size:.72em;color:var(--text2);white-space:nowrap}
.speed-wrap input[type=range]{width:88px;accent-color:var(--accent);margin:0}
.speed-val{font-size:.78em;font-weight:600;color:var(--accent);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
/* 固定宽度，字数变多时靠 JS 调小字号，避免控制栏换行跳动 */
.rate-label{display:inline-flex;align-items:center;justify-content:center;flex:0 0 104px;width:104px;height:26px;box-sizing:border-box;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums;padding:0 4px;background:rgba(15,118,110,.08);border-radius:6px;line-height:1}
.sta-label{color:var(--accent);font-size:10px;font-weight:700;white-space:nowrap;text-shadow:0 1px 2px #fff,0 0 3px #fff;pointer-events:none}
.legend{position:absolute;left:12px;bottom:24px;background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:10px;padding:8px 10px;z-index:1000;font-size:.7em;box-shadow:var(--shadow);max-width:300px}
.legend .row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
.legend .credit{color:var(--text3);line-height:1.5}
.train-label{position:absolute;left:12px;top:-7px;background:rgba(255,255,255,.94);color:#0F2E36;border:1px solid rgba(15,46,54,.25);border-radius:4px;padding:0 3px;font-size:9px;font-weight:700;white-space:nowrap;pointer-events:none}
.leaflet-tooltip.radar-tip{font-size:11px;padding:4px 7px;border-radius:6px}
#replayWrap{position:absolute;top:56px;bottom:0;left:0;right:0;display:none;flex-direction:column;z-index:999;background:var(--bg)}
.replay-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);font-size:.78em;z-index:2}
.replay-bar input{padding:5px 8px;border:1px solid var(--border);border-radius:7px;background:var(--bg)}
#replayFrame{flex:1;width:100%;border:0;background:#fff}
.err{position:absolute;left:50%;top:130px;transform:translateX(-50%);background:#FEF3C7;border:1px solid #FCD34D;color:#92400E;border-radius:10px;padding:9px 14px;z-index:1002;font-size:.8em;display:none;box-shadow:var(--shadow)}
@media(max-width:800px){
  .brand small{display:none}
  .topbar{height:auto;min-height:52px;flex-wrap:wrap;padding:7px 10px}
  .controls{top:auto;bottom:8px;left:8px;right:8px;padding:7px}
  .controls input[type=text]{width:130px}
  #map{top:0}
  .replayWrap{top:0}
  .detail{top:auto;bottom:130px;right:8px;width:min(320px,calc(100vw - 16px));max-height:48vh}
  .legend{display:none}
}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="brand">🗺️ 全国列车时刻地图<small>票路 · 铁路全景数据</small><span class="badge" id="modeBadge">时刻推算</span></div>
  <div class="top-actions">
    <span class="status" id="status">正在加载时刻数据…</span>
    <div class="themes" id="themes">
      <button data-theme="standard" class="on">标准</button>
      <button data-theme="satellite">卫星</button>
      <button data-theme="dark">夜色</button>
      <button data-theme="rail">线网</button>
    </div>
    <button class="btn" id="modeReplay">余票回放</button>
  </div>
</div>

<div class="controls" id="controls">
  <input type="date" id="mapDate" title="运行日期">
  <input type="range" id="timeRange" min="0" max="1439.9167" step="0.0833333" value="480">
  <span class="clock" id="clock">08:00:00</span>
  <span class="rate-label" id="rateLabel" title="每真实秒推进的模拟时间">1s → 5s</span>
  <button class="btn" id="playBtn" title="按 5 秒步进播放">▶ 播放</button>
  <span class="speed-wrap" title="播放速度：1/2/3/4/5/10/20/50/100/120×，1× 每秒走 5 秒，120× 每秒走 10 分钟">
    <span class="speed-cap">速度</span>
    <input type="range" id="speedRange" min="0" max="9" step="1" value="0" list="speedTicks">
    <datalist id="speedTicks">
      <option value="0"></option><option value="1"></option><option value="2"></option><option value="3"></option>
      <option value="4"></option><option value="5"></option><option value="6"></option><option value="7"></option>
      <option value="8"></option><option value="9"></option>
    </datalist>
    <span class="speed-val" id="speedVal">1×</span>
  </span>
  <button class="btn" id="nowBtn" title="回到当前时刻并自动刷新">现在</button>
  <input type="text" id="search" placeholder="车次 / 车站，如 G1、福州" autocomplete="off">
  <div class="chips" id="typeChips"></div>
  <label><input type="checkbox" id="showLines" checked> 路网</label>
  <label><input type="checkbox" id="showStations" checked> 站点</label>
  <label><input type="checkbox" id="showLabels"> 车次号</label>
  <button class="btn" id="fitBtn">全国</button>
  <button class="btn" id="clearBtn" title="清除路线/换乘高亮，恢复初始状态">清除</button>
</div>

<div id="map"></div>
<div class="err" id="errBar"></div>
<div class="detail" id="detail" style="display:none"></div>
<div class="legend" id="legend">
  <div class="row" id="legendTypes"></div>
  <div class="credit">位置：铁路全景（12306 图定时刻推算，非官方实时）· 回放：余票.info · 底图：高德地图 · 路网/站点：铁路全景</div>
</div>

<div id="replayWrap">
  <div class="replay-bar">
    <b>🕐 余票.info 时刻回放</b>
    <label>日期 <input type="date" id="replayDate"></label>
    <label>时间 <input type="time" id="replayTime" value="08:00"></label>
    <button class="btn on" id="syncView">同步当前视野与时刻</button>
    <span style="color:var(--text2)">另一套按 12306 时刻表推算的列车分布，可与左侧选中的车次对照</span>
  </div>
  <iframe id="replayFrame" title="余票.info 时刻回放地图" loading="lazy"></iframe>
</div>

<script src="/vendor/leaflet.min.js"></script>
<script>
(function () {
  'use strict';
  var API = '/api/rp';
  var TYPES = {
    G: { name: '高速动车', color: '#2563EB' }, D: { name: '动车组', color: '#0891B2' },
    C: { name: '城际', color: '#059669' }, Z: { name: '直达', color: '#7C3AED' },
    T: { name: '特快', color: '#D97706' }, K: { name: '快速', color: '#DC2626' },
    O: { name: '其他', color: '#64748B' }
  };
  var THEME_TILES = {
    standard: [{ style: 7, z: 1 }],
    satellite: [{ style: 6, z: 1 }, { style: 8, z: 2 }],
    dark: [{ style: 7, z: 1 }],
    rail: []
  };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var typeOf = function (t) { return TYPES[t] ? t : 'O'; };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  // 分钟浮点数：5 秒 = 1/12 分钟，时钟显示到秒
  var STEP_MIN = 1 / 12;
  var clockText = function (m) {
    var total = Math.round((((m % 1440) + 1440) % 1440) * 60);   // 一天内的整数秒
    return pad(Math.floor(total / 3600)) + ':' + pad(Math.floor(total / 60) % 60) + ':' + pad(total % 60);
  };
  // hash / 外部站点仍用 HH:MM，避免破坏兼容
  var clockHM = function (m) {
    var total = Math.round((((m % 1440) + 1440) % 1440) * 60);
    return pad(Math.floor(total / 3600)) + ':' + pad(Math.floor(total / 60) % 60);
  };
  var beijingDate = function () { return new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); };
  var dateToDay = function (s) { var p = s.split('-').map(Number); return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); };
  var shiftDate = function (s, days) {
    var p = s.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + days));
    return d.toISOString().slice(0, 10);
  };
  var timeToMs = function (date, minutes) { return dateToDay(date) * 86400000 - 8 * 3600000 + minutes * 60000; };

  // 高德瓦片 GCJ-02：上游数据是 WGS-84，必须转换
  var PI = Math.PI, A = 6378245.0, EE = 0.00669342162296594323;
  function tLat(x, y) {
    var r = -100 + 2*x + 3*y + .2*y*y + .1*x*y + .2*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
    r += (20*Math.sin(y*PI) + 40*Math.sin(y/3*PI)) * 2/3;
    r += (160*Math.sin(y/12*PI) + 320*Math.sin(y*PI/30)) * 2/3;
    return r;
  }
  function tLon(x, y) {
    var r = 300 + x + 2*y + .1*x*x + .1*x*y + .1*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
    r += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI)) * 2/3;
    r += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI)) * 2/3;
    return r;
  }
  function wgs2gcj(lon, lat) {
    if (!(lon > 73.66 && lon < 135.05 && lat > 3.86 && lat < 53.55)) return [lon, lat];
    var dLat = tLat(lon-105, lat-35), dLon = tLon(lon-105, lat-35);
    var rad = lat/180*PI, magic = Math.sin(rad);
    magic = 1 - EE*magic*magic;
    var sq = Math.sqrt(magic);
    dLat = dLat*180 / ((A*(1-EE)) / (magic*sq) * PI);
    dLon = dLon*180 / (A/sq * Math.cos(rad) * PI);
    return [lon + dLon, lat + dLat];
  }

  // 兼容用户给的两种 hash：#map=z/lat/lon 与 #time=HH:MM&@lat,lon,z
  var init = { zoom: 4, lat: 35.5, lon: 104, minutes: 480, date: beijingDate(), theme: 'standard' };
  function parseHash() {
    // 每次重解析先清掉旧深链字段，避免从「车次」切到「换乘」时残留
    delete init.train; delete init.legs; delete init.via;
    var raw = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (!raw) return;
    var m = raw.match(/map=([0-9.]+)\/(-?[0-9.]+)\/(-?[0-9.]+)/);
    if (m) { init.zoom = +m[1]; init.lat = +m[2]; init.lon = +m[3]; }
    var v = raw.match(/@(-?[0-9.]+),(-?[0-9.]+)(?:,([0-9.]+))?z?/);
    if (v) { init.lat = +v[1]; init.lon = +v[2]; if (v[3]) init.zoom = +v[3]; }
    var t = raw.match(/time=(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if (t) init.minutes = (+t[1]) * 60 + (+t[2]) + (t[3] ? (+t[3]) / 60 : 0);
    var d = raw.match(/date=(\d{4}-\d{2}-\d{2})/);
    if (d) init.date = d[1];
    var th = raw.match(/theme=(\w+)/);
    if (th && THEME_TILES[th[1]]) init.theme = th[1];
    var tr = raw.match(/train=([^&]+)/);
    if (tr) { try { init.train = decodeURIComponent(tr[1]).toUpperCase(); } catch (e) { init.train = tr[1].toUpperCase(); } }
    // 换乘方案：legs=车次1,车次2 同时画两段线路；via=换乘站名
    var lg = raw.match(/legs=([^&]+)/);
    if (lg) init.legs = lg[1].split(',').map(function (s) { return s.trim().toUpperCase(); }).filter(Boolean);
    var vi = raw.match(/via=([^&]+)/);
    if (vi) init.via = vi[1];
  }
  parseHash();
  init.zoom = Math.max(3, Math.min(12, init.zoom));

  var map = L.map('map', {
    center: [init.lat, init.lon], zoom: init.zoom, minZoom: 3, maxZoom: 17,
    zoomSnap: 0.01, zoomDelta: 0.5, attributionControl: true
  });
  // Leaflet 默认 latLngToLayerPoint 会 _round() 成整数像素，SVG 圆点每帧不足 1px 的位移会被量化成跳格。
  // 只针对CircleMarker保留亚像素投影，播放动画才能逐帧平滑移动。
  L.CircleMarker.prototype._project = function () {
    this._point = this._map.project(this._latlng)._subtract(this._map.getPixelOrigin());
    this._updateBounds();
  };
  var tileLayers = [], railLayer = null, railVisible = true;
  var trainRenderer = L.canvas({ padding: .25 }), stationRenderer = L.canvas({ padding: .2 });
  var trainLayer = L.layerGroup().addTo(map), labelLayer = L.layerGroup().addTo(map), stationLayer = L.layerGroup().addTo(map);
  var routeLayer = L.layerGroup().addTo(map), focusLayer = L.layerGroup().addTo(map);
  // 换乘方案线路单独一层：关闭车次详情时只清 routeLayer，不影响换乘地图的两段线路
  var transferLayer = L.layerGroup().addTo(map);
  var transferMode = false;
  // 专注模式：进入地图线路/换乘地图时只显示相关车次，隐藏其它车次与路网/站点
  // 是否在深链时自动开启，由管理设置 piaolu_admin.focusHide 决定（默认开启）
  var focusCodes = [], focusMode = false;
  function focusHideEnabled() {
    try {
      var raw = localStorage.getItem('piaolu_admin');
      if (!raw) return true;
      var o = JSON.parse(raw);
      return o.focusHide === undefined ? true : !!o.focusHide;
    } catch (e) { return true; }
  }
  var trains = [], trainById = new Map(), markers = new Map(), stations = [], selectedId = null;
  var query = '', activeTypes = {}, labelsOn = false, stationsOn = true;
  var minutes = init.minutes, dateStr = init.date, theme = init.theme;
  var playing = false, playTimer = null, liveTimer = null, fetchSeq = 0, selectedTrainCode = null;
  // 位置请求：最小间隔节流 + 单飞行，避免高速播放时 debounce 吞请求 / 高频请求饿死
  var fetchTimer = null, nextFetchAt = 0, fetching = false, fetchPending = false, lastFetchSentAt = 0;
  // 播放：速度 N× = 每真实秒推进 N 个 5 秒步长（1×=5秒/秒，120×=10分钟/秒）
  var speed = 1, playMs = 1000, animMs = 650, fetchGapMs = 250, playRaf = 0, playLast = 0, playCarry = 0;
  var hashTimer = null, detailData = null, detailTab = 'table';

  var trackCache = new Map(), trackFetching = false, trackFetchAt = 0, trackGen = 0, trackGroup = 0;

  function setTheme(name) {

  function lineStyle() {

  function writeHash() {

    var h = '#map=' + map.getZoom().toFixed(2) + '/' + c.lat.toFixed(4) + '/' + c.lng.toFixed(4) +
      '&time=' + clockText(minutes) + '&date=' + dateStr + '&theme=' + theme +
      (init.train ? '&train=' + encodeURIComponent(init.train) : '') +
      (init.legs && init.legs.length ? '&legs=' + encodeURIComponent(init.legs.join(',')) : '') +

  function matches(t) {
    if (focusMode && focusCodes.indexOf(t.id) < 0) return false;   // 专注模式只留目标车次
    if (!activeTypes[typeOf(t.cls)]) return false;

    return [t.id, t.from, t.to].join(' ').toLowerCase().indexOf(query) >= 0;
  }
  function iconFor(t, isSel) {

      color: isSel ? '#F59E0B' : '#fff', weight: isSel ? 2.5 : .8,

    }).bindTooltip('<b>' + esc(t.id) + '</b> ' + esc(t.from) + ' → ' + esc(t.to) +
      '<br>' + (t.moving ? t.speed + ' km/h' : '停站中'),
      { className: 'radar-tip', direction: 'top', offset: [0, -6] });
  }

  // 位置动画：只给视野内的车做逐帧插值，视野外直接跳，避免几千个 marker 每帧重画
  function moveMarker(m, lat, lon, animate) {
    var to = L.latLng(lat, lon);
    if (!animate || !map.getBounds().pad(0.1).contains(to)) {
      animating.delete(m); m.setLatLng(to); return;
    }
    var from = m.getLatLng();
    if (Math.abs(from.lat - lat) < 1e-9 && Math.abs(from.lng - lon) < 1e-9) return;
    // 防御：单帧坐标跳变超过 2° 视为异常（或同车次不同径路），直接归位，不做跨屏飞行
    if (Math.abs(from.lat - lat) > 2 || Math.abs(from.lng - lon) > 2) {
      animating.delete(m); m.setLatLng(to); return;
    }
    animating.set(m, { from: from, to: to, start: performance.now(), dur: animMs });
  }
  // 播放时按「当前样本 + 航向 + 速度」逐帧推算位置，车头沿路线切线连续前进；
  // 新样本到达后只做短时误差修正，不在两个采样点之间直线跳跃。
  function projectNav(nav, simSec) {
    var km = nav.moving ? (nav.speed * simSec / 3600) : 0;
    var rad = nav.bearing * Math.PI / 180;
    return {
      lat: nav.lat + (km * Math.cos(rad)) / 111.32,
      lon: nav.lon + (km * Math.sin(rad)) / (111.32 * Math.max(.2, Math.cos(nav.lat * Math.PI / 180)))
    };
  }
  function setNav(m, t) {
    var now = performance.now();
    // 样本是发请求那一刻算出来的，响应路上又过了几十毫秒；
    // 把 t0 回拨到发送时刻，避免每批样本都把车头拽回几十毫秒前，形成一顿一顿。
    var latency = lastFetchSentAt ? Math.min(250, Math.max(0, now - lastFetchSentAt)) : 0;
    var nav = {
      t0: now - latency, lat: t.lat, lon: t.lon,
      bearing: t.bearing || 0, speed: t.speed || 0, moving: !!t.moving
    };
    // 修正量以「响应到达时」为基准：当前屏幕位置 vs 新样本推算到同一时刻的位置
    var ahead = projectNav(nav, playing ? latency * speed * 5 / 1000 : 0);
    var base = wgs2gcj(ahead.lon, ahead.lat);
    var cur = m.getLatLng();
    var corrLat = cur.lat - base[1], corrLng = cur.lng - base[0];
    if (Math.abs(corrLat) > .05 || Math.abs(corrLng) > .05) { corrLat = 0; corrLng = 0; }
    nav.corrLat = corrLat; nav.corrLng = corrLng;
    m._nav = nav;
    navMarkers.add(m);
  }
  function animateTick(ts) {
    if (playing) ensureTracks(false);
    var simMs = timeToMs(dateStr, minutes);
    animating.forEach(function (a, m) {
      var p = Math.min(1, (ts - a.start) / a.dur);
      var e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      m.setLatLng([a.from.lat + (a.to.lat - a.from.lat) * e, a.from.lng + (a.to.lng - a.from.lng) * e]);
      if (p >= 1) animating.delete(m);
    });
    // 全国视图（z<6）一屏几千个点，逐帧全量重画会掉到 30fps；隔帧更新，位移仍小于 1px
    var navIdx = 0, navStride = map.getZoom() < 6 ? 2 : 1;
    navMarkers.forEach(function (m) {
      var nav = m._nav;
      if (!nav) { navMarkers.delete(m); return; }
      if ((navIdx++ % navStride) !== 0 && !(followTrain && m._uid === selectedId)) return;
      var lat, lon, gLat, gLon;
      // 优先用服务端轨道采样：位置严格落在运行图上，不会在高倍速外推时切出轨道
      var trk = trackCache.get(m._uid);
      if (trk && trk.lats && trk.lats.length > 1) {
        var idx = (simMs - trk.t0) / (trk.step * 1000);
        if (idx >= 0 && idx < trk.lats.length - 1) {
          var i0 = Math.floor(idx), f = idx - i0;
          lat = trk.lats[i0] + (trk.lats[i0 + 1] - trk.lats[i0]) * f;
          lon = trk.lons[i0] + (trk.lons[i0 + 1] - trk.lons[i0]) * f;
          var tp = wgs2gcj(lon, lat);
          gLat = tp[1]; gLon = tp[0];
          m.setLatLng([gLat, gLon]);
          var tt = trainById.get(m._uid);
          var brg = tt ? (tt.bearing || 0) : 0;
          var dLat = trk.lats[i0 + 1] - trk.lats[i0], dLon = trk.lons[i0 + 1] - trk.lons[i0];
          if (Math.abs(dLat) + Math.abs(dLon) > 1e-9) {
            brg = (Math.atan2(dLon * Math.cos(lat * Math.PI / 180), dLat) * 180 / Math.PI + 360) % 360;
          }
          if (tt) { tt.lat = lat; tt.lon = lon; tt.bearing = brg; }
          if (m._uid === selectedId) moveFocusMarker(gLat, gLon, brg);
          if (followTrain && m._uid === selectedId) map.setView([gLat, gLon], map.getZoom(), { animate: false });
          return;
        }
      }
      var realDt = Math.max(0, ts - nav.t0);

      var simSec = playing ? Math.min(240, realDt * speed * 5 / 1000) : 0;
      var q = projectNav(nav, simSec);
      lat = q.lat; lon = q.lon;
      var p = wgs2gcj(lon, lat);
      var k = Math.max(0, 1 - realDt / 220);

      m.setLatLng([gLat, gLon]);
      var t = trainById.get(m._uid);
      if (t) { t.lat = lat; t.lon = lon; }
      if (m._uid === selectedId) moveFocusMarker(gLat, gLon, nav.bearing);
      if (followTrain && m._uid === selectedId) map.setView([gLat, gLon], map.getZoom(), { animate: false });

  }
  rafId = requestAnimationFrame(animateTick);

  function renderTrains(list, timeMs, total) {
    var seen = new Set();
    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      if (!isFinite(t.lat) || !isFinite(t.lon)) continue;
      var uid = t.uid || t.id;                  // 同车次多趟在途时必须按 uid 建 marker
      seen.add(uid); trainById.set(uid, t);
      var m = markers.get(uid);
      var p = wgs2gcj(t.lon, t.lat);
      var visible = map.getBounds().pad(0.1).contains([p[1], p[0]]);
      if (m) {
        if (playing && visible && matches(t)) setNav(m, t);
        else {
          navMarkers.delete(m); m._nav = null;
          moveMarker(m, p[1], p[0], true);
        }
      } else {
        m = iconFor(t, uid === selectedId);
        m.on('click', function () { selectTrain(this._uid); });
        m._uid = uid; markers.set(uid, m);
        if (playing && visible && matches(t)) setNav(m, t);
      }
      if (matches(t)) { if (!trainLayer.hasLayer(m)) trainLayer.addLayer(m); }
      else if (trainLayer.hasLayer(m)) {
        trainLayer.removeLayer(m);
        navMarkers.delete(m); m._nav = null;
      }
    }
    markers.forEach(function (m, id) {
      if (!seen.has(id)) {
        trainLayer.removeLayer(m);
        navMarkers.delete(m); m._nav = null;
        markers.delete(id);
      }
    });
    // 深链先建的是 code@deep 的占位车；一旦真实车次出现在列表里，切到真实 uid，跟随才会动
    if (selectedId && selectedId.indexOf('@deep') > 0) {
      var deepCode = selectedTrainCode || selectedId.split('@')[0];
      for (var di = 0; di < list.length; di++) {
        if (list[di].id === deepCode) {
          var oldId = selectedId;
          selectedId = list[di].uid; selectedTrainCode = deepCode;
          trainById.delete(oldId);
          var rm = markers.get(selectedId);
          if (rm) { rm.setStyle({ color: '#F59E0B', weight: 2.5, fillOpacity: 1 }); rm.setRadius(7); }
          break;
        }
      }
    }
    trains = list;
    if (!playing || performance.now() - lastDrawLabels > 180) {
      drawLabels(); lastDrawLabels = performance.now();
    }
    if (selectedId && !seen.has(selectedId)) fetchSelectedState(timeMs || timeToMs(dateStr, minutes));
    if (selectedId) updateFocusMarker();
    var st = $('status'); st.classList.remove('warn');
    st.textContent = transferMode
      ? '● 换乘线路：' + (init.legs || []).join(' → ') + ' · ' + clockText(minutes)
      : focusMode
        ? '● 专注：' + (focusCodes.join(' / ') || '目标车次') + ' · ' + clockText(minutes)
        : '● ' + (total || list.length) + ' 列在途 · ' + clockText(minutes);
  }
  function applyFilter() {
    var shown = 0;
    for (var i = 0; i < trains.length; i++) {
      var t = trains[i], m = markers.get(t.uid || t.id); if (!m) continue;
      if (matches(t)) { trainLayer.addLayer(m); shown++; }
      else {
        trainLayer.removeLayer(m);
        navMarkers.delete(m); m._nav = null;
      }
    }

  }
  function drawLabels() {
    labelLayer.clearLayers();

    var b = map.getBounds(), n = 0;
    for (var i = 0; i < trains.length && n < 220; i++) {
      var t = trains[i];
      if (!matches(t) || !b.contains([t.lat, t.lon])) continue;
      var p = wgs2gcj(t.lon, t.lat);
      L.marker([p[1], p[0]], {
        interactive: false,
        icon: L.divIcon({ className: '', html: '<span class="train-label" style="border-color:' + TYPES[typeOf(t.cls)].color + '">' + esc(t.id) + '</span>', iconSize: [0, 0] })
      }).addTo(labelLayer);

  }
  var bboxTimer = null;

      if (!followTrain) writeHash();

      // 视野变了要按新 bbox 重新取车；跟随时 setView 每帧都会 moveend，跳过

  function beijingHM(ms) {
    if (ms == null) return '';
    var d = new Date(ms + 8 * 3600000);
    return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
  }

  var focusMarker = null;
  function clearRoute() { routeLayer.clearLayers(); focusLayer.clearLayers(); focusMarker = null; }

  function updateFocusMarker() {
    var t = trainById.get(selectedId);
    if (!t) {
      if (focusMarker) { focusLayer.removeLayer(focusMarker); focusMarker = null; }
      return;
    }
    var q = wgs2gcj(t.lon, t.lat);
    if (!focusMarker) {
      var arrow = '<svg width="22" height="22" viewBox="0 0 22 22" style="transform:rotate(' + (t.bearing || 0) + 'deg)">' +
        '<path d="M11 1 L17 19 L11 15 L5 19 Z" fill="#F59E0B" stroke="#fff" stroke-width="1.5"/></svg>';
      focusMarker = L.marker([q[1], q[0]], {
        interactive: false,

      }).addTo(focusLayer);
    } else {

    if (followTrain) map.setView([q[1], q[0]], map.getZoom(), { animate: false });
  }
  // 选中车每帧都在动，焦点箭头也要跟着走，不能只靠每 600ms 一次的车次列表刷新
  function moveFocusMarker(gLat, gLon, bearing) {
    if (!focusMarker) return;
    focusMarker.setLatLng([gLat, gLon]);

  function centerOnSelected() {
    var t = trainById.get(selectedId); if (!t) return;

  function drawRoute() {
    clearRoute();
    if (!detailData) return;
    var path = detailData.path || [];
    if (path.length > 1) {
      var pts = path.map(function (p) { var q = wgs2gcj(p[0], p[1]); return [q[1], q[0]]; });
      L.polyline(pts, { renderer: L.canvas(), color: '#FFFFFF', weight: 10, opacity: .8, interactive: false }).addTo(routeLayer);
      L.polyline(pts, { renderer: L.canvas(), color: '#E11D48', weight: 5, opacity: .95, interactive: false }).addTo(routeLayer);
    }
    (detailData.stops || []).forEach(function (s) {
      if (s.lat == null || s.lon == null) return;
      var q = wgs2gcj(s.lon, s.lat);
      L.circleMarker([q[1], q[0]], {
        radius: 5, color: '#fff', weight: 2, fillColor: '#E11D48', fillOpacity: 1
      }).bindTooltip(esc(s.name), { direction: 'top' }).addTo(routeLayer);
      if (map.getZoom() >= 8) {
        L.marker([q[1], q[0]], {
          interactive: false,
          icon: L.divIcon({ className: '', html: '<span class="sta-label">' + esc(s.name) + '</span>', iconSize: [0, 0], iconAnchor: [0, 0] })
        }).addTo(routeLayer);
      }
    });
    updateFocusMarker();
  }

  function renderTable() {
    var t = trainById.get(selectedId), stops = (detailData && detailData.stops) || [];
    if (!stops.length) return '<div style="padding:12px;color:var(--text2)">暂无停站数据</div>';
    var now = timeToMs(dateStr, minutes);
    var html = '<table><thead><tr><th>车站</th><th class="num">到</th><th class="num">发</th><th class="num">停</th></tr></thead><tbody>';
    stops.forEach(function (s, i) {
      var cls = s.name === t.from ? 'cur' : (s.name === t.to ? 'next' : (s.dep && s.dep < now ? 'past' : ''));
      var dwell = (s.arr != null && s.dep != null) ? Math.round((s.dep - s.arr) / 60000) : 0;
      html += '<tr class="' + cls + '"><td><a data-stop="' + i + '">' + esc(s.name) + '</a></td>' +
        '<td class="num">' + beijingHM(s.arr) + '</td><td class="num">' + beijingHM(s.dep) + '</td>' +
        '<td class="num">' + (dwell || '') + '</td></tr>';
    });
    return html + '</tbody></table>';
  }

  function renderChart() {
    var stops = (detailData && detailData.stops) || [];
    if (!stops.length) return '<div style="padding:12px;color:var(--text2)">暂无运行图数据</div>';
    var t0 = stops[0].dep || stops[0].arr;
    var t1 = stops[stops.length - 1].arr || stops[stops.length - 1].dep;
    if (t0 == null || t1 == null || t1 <= t0) t1 = (t0 || Date.now()) + 3600000;
    var gap = 24, H = stops.length * gap + 44, W = 320;
    var X = function (v) { return 52 + (v - t0) / (t1 - t0) * 248; };
    var s = '<div class="chart"><svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    s += '<text x="52" y="11" font-size="10" fill="#8CA8B2">' + beijingHM(t0) + '</text>' +
      '<text x="272" y="11" font-size="10" fill="#8CA8B2">' + beijingHM(t1) + '</text>';
    stops.forEach(function (st, i) {
      var y = 32 + i * gap, a = st.arr != null ? X(st.arr) : null, d = st.dep != null ? X(st.dep) : null;
      s += '<text x="3" y="' + (y + 3) + '" font-size="10" fill="#54727D">' + esc(st.name) + '</text>' +
        '<line x1="46" y1="' + y + '" x2="306" y2="' + y + '" stroke="#E2E8F0"/>';
      if (a != null && d != null && d > a) s += '<line x1="' + a + '" y1="' + y + '" x2="' + d + '" y2="' + y + '" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>';
      else if (d != null) s += '<circle cx="' + d + '" cy="' + y + '" r="3" fill="#0F766E"/>';
      if (i > 0) {
        var pd = stops[i - 1].dep != null ? X(stops[i - 1].dep) : null;
        if (pd != null && a != null) s += '<line x1="' + pd + '" y1="' + (y - gap) + '" x2="' + a + '" y2="' + y + '" stroke="#0F766E" stroke-width="2"/>';
      }
    });
    var now = timeToMs(dateStr, minutes);
    if (now >= t0 && now <= t1) {
      var nx = X(now);
      s += '<line x1="' + nx + '" y1="18" x2="' + nx + '" y2="' + (H - 8) + '" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4 3"/>' +
        '<text x="' + (nx + 3) + '" y="24" font-size="10" fill="#DC2626">现在</text>';
    }
    return s + '</svg></div>';
  }

  function selectTrain(uid) {
    var t = trainById.get(uid); if (!t) return;
    var code = t.id;                            // 车次号只用于详情接口 / 深链 / 余票回放
    selectedId = uid; selectedTrainCode = code; detailData = null; detailTab = 'table';
    markers.forEach(function (m, key) {
      var sel = key === uid;
      m.setStyle({ color: sel ? '#F59E0B' : '#fff', weight: sel ? 2.5 : .8, fillOpacity: sel ? 1 : .92 });
      m.setRadius(sel ? 7 : (map.getZoom() >= 8 ? 4.5 : 3.4));
    });
    var p = wgs2gcj(t.lon, t.lat);
    if (!map.getBounds().contains([p[1], p[0]])) map.panTo([p[1], p[0]]);
    $('detail').style.display = '';
    renderPanel(); updateFocusMarker();
    if (detailData && detailData.id === code) { drawRoute(); renderPanel(); return; }
    fetch(API + '/train/' + encodeURIComponent(code) + '?date=' + dateStr)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        // 深链的 code@deep 占位 uid 可能已经被真实 uid 替换；只要还是同一车次就接收数据
        if (!selectedId || selectedTrainCode !== code) return;
        detailData = d; drawRoute(); renderPanel();
      })
      .catch(function () {});
  }
  function closeDetail() {
    selectedId = null; selectedTrainCode = null; detailData = null; followTrain = false;
    // 复位所有 marker 的选中样式，避免关闭后仍有车保持橙色大圆点
    markers.forEach(function (m) {

    });

  }
  map.on('click', function () { if (selectedId) closeDetail(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && selectedId) closeDetail(); });

  // 深链：/live-map.html#...&train=G1 —— 不依赖该车此刻在途，也能画出全程线路
  function openDeepLinkedTrain() {
    var code = init.train;
    if (!code) return;
    focusCodes = [code]; focusMode = focusHideEnabled();
    syncBaseLayers(); applyFilter();
    fetch(API + '/train/' + encodeURIComponent(code) + '?date=' + dateStr)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.stops || !d.stops.length) return;
        var first = d.stops[0], last = d.stops[d.stops.length - 1];
        var mid = d.stops[Math.floor(d.stops.length / 2)] || first;
        var uid = code + '@deep';
        trainById.set(uid, {
          id: code, uid: uid, cls: d.cls || 'O', from: first.name, to: last.name,
          lat: mid.lat != null ? mid.lat : first.lat,
          lon: mid.lon != null ? mid.lon : first.lon,
          bearing: 0, speed: 0, moving: true
        });
        detailData = d;
        selectTrain(uid);
        var pts = (d.path || []).map(function (p) { var q = wgs2gcj(p[0], p[1]); return [q[1], q[0]]; });
        if (pts.length) map.flyToBounds(pts, { padding: [70, 70], maxZoom: 10, duration: .8 });
      }).catch(function () {});
  }

  // 换乘方案：同时画两段车次的全程线路，并高亮真正的换乘站
  function openDeepLinkedLegs() {
    var codes = init.legs || [];
    if (codes.length < 2) return;
    var colors = ['#2563EB', '#DC2626', '#7C3AED', '#059669'];
    var viaNames = (init.via || '').split(/[\/、,，\s]+/).filter(Boolean);
    transferMode = true;
    focusCodes = codes.slice(); focusMode = focusHideEnabled();
    syncBaseLayers(); applyFilter();
    Promise.all(codes.map(function (code) {
      return fetch(API + '/train/' + encodeURIComponent(code) + '?date=' + dateStr)
        .then(function (r) { return r.json(); })
        .catch(function () { return null; });
    })).then(function (datas) {
      transferLayer.clearLayers();
      var allPts = [], stopHits = [];
      datas.forEach(function (d, i) {
        if (!d || !Array.isArray(d.path) || !d.path.length) return;
        var pts = d.path.map(function (p) { var q = wgs2gcj(p[0], p[1]); return [q[1], q[0]]; });
        allPts = allPts.concat(pts);
        var col = colors[i % colors.length];
        L.polyline(pts, { renderer: L.canvas(), color: '#FFFFFF', weight: 9, opacity: .8, interactive: false }).addTo(transferLayer);
        L.polyline(pts, { renderer: L.canvas(), color: col, weight: 5, opacity: .95, interactive: false })
          .bindTooltip(codes[i] + ' 全程线路', { className: 'radar-tip' }).addTo(transferLayer);
        (d.stops || []).forEach(function (s) {
          if (s.lat == null || !viaNames.length) return;
          if (viaNames.some(function (n) { return s.name === n || s.name.indexOf(n) >= 0; }))
            stopHits.push({ name: s.name, lat: s.lat, lon: s.lon });
        });
      });
      // 换乘站优先取两段车次真实停靠点；没有再用全局站点表兜底
      var hits = [];
      stopHits.forEach(function (s) {
        if (!hits.some(function (h) { return h.name === s.name; })) hits.push(s);
      });
      if (!hits.length && stations.length) {
        hits = stations.filter(function (s) {
          return viaNames.some(function (n) { return s.name === n || s.name.indexOf(n) >= 0; });
        }).slice(0, 4);
      }
      hits.forEach(function (s) {
        var q = wgs2gcj(s.lon, s.lat);
        L.circleMarker([q[1], q[0]], {
          radius: 9, color: '#FFFFFF', weight: 3, fillColor: '#F59E0B', fillOpacity: 1
        }).bindTooltip('🔄 换乘站：' + esc(s.name), {
          direction: 'top', className: 'radar-tip', permanent: true, offset: [0, -10]
        }).addTo(transferLayer);
      });
      if (allPts.length) map.flyToBounds(allPts, { padding: [60, 60], maxZoom: 9, duration: .8 });
      $('status').textContent = '● 换乘线路：' + codes.join(' → ') +
        (hits.length ? ' · 换乘站 ' + hits.map(function (h) { return h.name; }).join('/') : '');
    });
  }

  function clearTracks() {
    trackGen++;
    trackCache.clear(); trackFetchAt = 0; trackGroup = 0;
  }
  function trackUids() {
    var out = [], b = map.getBounds().pad(.05);
    if (selectedId) out.push(selectedId);
    markers.forEach(function (m, uid) {
      if (out.length >= 240) return;
      if (uid !== selectedId && b.contains(m.getLatLng())) out.push(uid);
    });
    return out;
  }
  function ensureTracks(force) {
    if (!playing && !force) return;
    var now = Date.now();
    if (!force && now < trackFetchAt) return;
    if (trackFetching) return;
    var all = trackUids();
    if (!all.length) return;
    var group = trackGroup++ % TRACK_GROUPS;
    var uids = all.filter(function (_, i) { return i % TRACK_GROUPS === group; });
    if (!uids.length) return;
    trackFetching = true;
    var gen = trackGen;
    // 1200 秒窗口分 8 批续取；每批相隔 windowReal/2/8，整轮在窗口消耗一半前覆盖完
    var windowReal = (1200 / Math.max(1, speed * 5)) * 1000;
    var refresh = Math.max(100, Math.min(10000, windowReal * .5 / TRACK_GROUPS));
    trackFetchAt = now + refresh;
    // 放大后才需要 5 秒级精度；全国/省域视图用 15 秒样本，数据量约为 1/3
    var trackStep = map.getZoom() >= 8 ? 5 : 15;
    fetch(API + '/playback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ t: timeToMs(dateStr, minutes), span: 1200, step: trackStep, uids: uids })
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (gen !== trackGen || !d || !d.tracks) return;
      d.tracks.forEach(function (tr) {
        tr.t0 = d.time; tr.step = d.step;
        trackCache.set(tr.uid, tr);
      });
    }).catch(function () {}).then(function () { trackFetching = false; });
  }

  // 跟随的车次拖到「不在途」时刻时，普通 trains 列表已没有它，单独取精确位置让视角继续跟随
  function fetchSelectedState(ms) {
    if (!selectedId) return;
    fetch(API + '/state?uid=' + encodeURIComponent(selectedId) + '&t=' + ms, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !isFinite(d.lat) || !isFinite(d.lon)) return;
        var old = trainById.get(selectedId) || {};
        trainById.set(selectedId, Object.assign({}, old, d));
        updateFocusMarker();          // 跟随时会在这里 setView 到新时刻的位置
        refreshDetail();
      })
      .catch(function () {});
  }
  function fetchTrains() {
    if (fetching) { fetchPending = true; return; }   // 单飞行：避免高速播放时请求堆高、响应全被 seq 丢弃
    fetching = true;
    var seq = ++fetchSeq;
    var ms = timeToMs(dateStr, minutes);
    lastFetchSentAt = performance.now();       // 用于补偿请求延迟，避免样本总是落后一拍
    var bb = map.getBounds().pad(.2);
    var bbox = [bb.getWest(), bb.getSouth(), bb.getEast(), bb.getNorth()].map(function (v) { return v.toFixed(4); }).join(',');
    fetch(API + '/trains?t=' + ms + '&bbox=' + bbox, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        if (seq === fetchSeq) { $('errBar').style.display = 'none'; renderTrains(d.trains || [], d.time, d.count); }
      })
      .catch(function (e) {
        if (seq !== fetchSeq) return;
        $('errBar').textContent = '时刻数据暂不可用（' + e.message + '），正在重试…';
        $('errBar').style.display = '';
        $('status').classList.add('warn'); $('status').textContent = '数据中断';
      })
      .then(function () {
        fetching = false;
        if (fetchPending) { fetchPending = false; fetchTrains(); }
      });
  }
  // 最小间隔节流：已有排队请求就不再重设定时器，播放时不会出现“每次都清空上一次”的饥饿
  function scheduleFetch() {
    if (fetchTimer) return;
    var wait = Math.max(0, nextFetchAt - Date.now());
    function run() {
      fetchTimer = null;
      var gap = fetchGapMs;
      if (playing && map.getZoom() < 6) gap = Math.max(gap, 1400);   // 全国视图点太多，列表少刷几次
      nextFetchAt = Date.now() + (playing ? gap : 150);
      fetchTrains();
    }
    if (wait <= 0) run(); else fetchTimer = setTimeout(run, wait);
  }
  function setTime(m, fromUser, align5, playbackTick) {
    // 跨过 24:00 时把日期一起进/退位，不能只把时钟拨回 00:00
    var dayShift = Math.floor(m / 1440);
    if (dayShift) {
      dateStr = shiftDate(dateStr, dayShift);
      $('mapDate').value = dateStr;
      $('replayDate').value = dateStr;
    }
    minutes = ((m % 1440) + 1440) % 1440;
    if (align5) minutes = Math.floor(minutes * 12 + 1e-6) / 12;   // 对齐到 5 秒
    $('timeRange').value = minutes;
    $('clock').textContent = clockText(minutes);
    $('replayTime').value = clockHM(minutes);
    // 播放时每帧都在推进，详情重绘节流到 120ms，避免重排造成顿挫
    var nowTs = performance.now();
    if (!playing || nowTs - lastDetailRefresh > 120) {
      refreshDetail();                    // 同步状态 / 时刻表高亮 / 运行图“现在”线
      lastDetailRefresh = nowTs;
    }
    if (fromUser) {
      if (liveTimer) stopLive();
      if (!playbackTick) clearTracks();   // 拖动时间轴 / 改日期时旧轨道窗口失效
      // 固定节流窗口：不能每次都 clearTimeout，否则高帧率下 hash 永远写不出去
      if (!hashTimer) hashTimer = setTimeout(function () { hashTimer = null; writeHash(); }, 150);
      if (followTrain && !playbackTick) {
        // 只有用户拖动/修改时间时才立刻取新时刻位置；播放帧不能每帧强制请求
        clearTimeout(fetchTimer); fetchTimer = null; nextFetchAt = 0;
        fetchTrains();
      } else scheduleFetch();
    }
  }
  $('timeRange').addEventListener('input', function () { setTime(+this.value, true); });
  $('mapDate').onchange = function () { dateStr = this.value; $('replayDate').value = dateStr; stopLive(); clearTracks(); writeHash(); fetchTrains(); };
  function startLive() {
    stopLive();
    if (playing) stopPlay();                  // 必须真正停掉播放，否则时钟马上又被推走
    followTrain = false;                      // “现在”是回到当前时刻，不应继续锁在某一趟车上
    var fb = $('followBtn'); if (fb) fb.classList.remove('on');
    clearTimeout(fetchTimer); fetchTimer = null; nextFetchAt = 0;
    clearTracks();
    var now = new Date(Date.now() + 8 * 3600e3);
    dateStr = now.toISOString().slice(0, 10);
    $('mapDate').value = dateStr; $('replayDate').value = dateStr;
    var nowMin = now.getUTCHours() * 60 + now.getUTCMinutes() + now.getUTCSeconds() / 60;
    setTime(nowMin, false);
    writeHash();                              // 立刻把 URL 时刻同步为现在，不能只改 DOM
    $('modeBadge').textContent = '实时跟随';
    $('nowBtn').classList.add('on');
    fetchTrains();
    liveTimer = setInterval(function () {
      var n = new Date(Date.now() + 8 * 3600e3);
      dateStr = n.toISOString().slice(0, 10); $('mapDate').value = dateStr;
      setTime(n.getUTCHours() * 60 + n.getUTCMinutes() + n.getUTCSeconds() / 60, false);
      writeHash();
      fetchTrains();
    }, 30000);
  }
  function stopLive() {
    if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
    $('nowBtn').classList.remove('on');
    $('modeBadge').textContent = '时刻推算';
  }
  $('nowBtn').onclick = startLive;
  function startPlay() {
    stopLive();
    playLast = 0; playCarry = 0;
    function frame(ts) {
      if (!playing) return;
      if (!playLast) playLast = ts;
      var dt = Math.min(100, ts - playLast);       // 单帧最多补 100ms，防止切后台跳变
      playLast = ts;
      // 每帧连续推进模拟时间，不再“攒够 5 秒才动一下”，时钟和车头同步走
      setTime(minutes + (dt * speed * 5 / 1000) / 60, true, false, true);
      playRaf = requestAnimationFrame(frame);
    }
    playRaf = requestAnimationFrame(frame);
  }
  function stopPlay() {
    playing = false;
    if (playRaf) cancelAnimationFrame(playRaf);
    if (playTimer) clearInterval(playTimer);
    playRaf = 0; playTimer = null; playLast = 0; playCarry = 0; nextFetchAt = 0;
    $('playBtn').textContent = '▶ 播放';
    $('playBtn').classList.remove('on');
    // 暂停时把推算位置对齐回该时刻的精确样本，避免停在外推点上
    fetchTrains();
  }
  $('playBtn').onclick = function () {
    if (playing) { stopPlay(); return; }
    playing = true;
    this.textContent = '⏸ 暂停';
    this.classList.add('on');
    startPlay();
  };
  var SPEED_STEPS = [1, 2, 3, 4, 5, 10, 20, 50, 100, 120];
  // 每真实秒推进的模拟时间：speed×5 秒；>=60 秒换算成分钟显示
  function rateText(n) {
    var sec = n * 5;
    if (sec < 60) return '1s → ' + sec + 's';
    var mi = Math.floor(sec / 60), rs = sec % 60;
    return '1s → ' + mi + '分' + (rs ? rs + '秒' : '钟');
  }
  function applySpeed() {
    speed = SPEED_STEPS[+$('speedRange').value] || 1;
    playMs = 1000 / speed;                          // 一个 5 秒步长的真实耗时
    // 轨道回放已经负责位置，列车列表不需要 60ms 刷一次；降低 JSON 解析和 GC 压力
    fetchGapMs = Math.max(600, Math.min(1200, Math.round(playMs * .6)));
    // 动画时长略长于采样间隔，位置还没走完就被下一样本接管，视觉上连续
    animMs = Math.max(90, Math.min(650, Math.round(playMs * 0.85)));
    $('speedVal').textContent = speed + '×';
    var label = $('rateLabel'), txt = rateText(speed);
    label.textContent = txt;
    // 固定宽度内自适应字号：短文案 12px，最长「1s → 8分20秒」缩到 10px
    label.style.fontSize = (txt.length > 11 ? 10 : txt.length > 8 ? 11 : 12) + 'px';
  }
  $('speedRange').addEventListener('input', applySpeed);
  applySpeed();
  $('refreshBtn') && ($('refreshBtn').onclick = fetchTrains);

  function loadLines() {
    fetch(API + '/lines').then(function (r) { return r.json(); }).then(function (d) {
      railLayer = L.geoJSON(d, { renderer: L.canvas({ padding: .2 }), interactive: false, style: lineStyle() });
      syncBaseLayers();
    }).catch(function () {});
  }
  function loadStations() {
    fetch(API + '/stations').then(function (r) { return r.json(); }).then(function (d) {
      stations = d.stations || [];
      stations.forEach(function (s) {
        var p = wgs2gcj(s.lon, s.lat);
        L.circleMarker([p[1], p[0]], {
          renderer: stationRenderer, radius: 2, color: '#fff', weight: .5,
          fillColor: theme === 'satellite' ? '#A5F3FC' : '#0F766E', fillOpacity: .75, interactive: false
        }).addTo(stationLayer);
      });
      syncBaseLayers();
    }).catch(function () {});
  }
  // 专注模式自动隐藏路网/站点/车次号，只留目标车次与高亮线路
  function syncBaseLayers() {
    if (railLayer) {
      if (railVisible && !focusMode) { if (!map.hasLayer(railLayer)) railLayer.addTo(map); }
      else if (map.hasLayer(railLayer)) map.removeLayer(railLayer);
    }
    if (stationsOn && !focusMode) { if (!map.hasLayer(stationLayer)) stationLayer.addTo(map); }
    else if (map.hasLayer(stationLayer)) map.removeLayer(stationLayer);
    if (labelsOn && !focusMode && map.getZoom() >= 7) drawLabels();
    else labelLayer.clearLayers();
  }
  $('showLines').onchange = function () { railVisible = this.checked; syncBaseLayers(); };
  $('showStations').onchange = function () { stationsOn = this.checked; syncBaseLayers(); };
  $('showLabels').onchange = function () { labelsOn = this.checked; drawLabels(); };
  $('fitBtn').onclick = function () { map.flyToBounds([[18, 73], [54, 135]], { duration: .7 }); };
  // 清除：退出专注模式，清掉详情/高亮线路，恢复初始视图
  $('clearBtn').onclick = function () {
    focusMode = false; focusCodes = [];
    transferMode = false; transferLayer.clearLayers();
    if (selectedId) closeDetail(); else { clearRoute(); }
    delete init.train; delete init.legs; delete init.via;
    query = ''; $('search').value = '';
    syncBaseLayers(); applyFilter();
    writeHash();
    map.flyToBounds([[18, 73], [54, 135]], { duration: .7 });
    $('status').textContent = '● ' + trains.length + ' 列在途 · ' + clockText(minutes);
  };
  $('search').addEventListener('input', function () {
    query = this.value.trim().toLowerCase();
    if (query.length >= 2) {
      var s = stations.find(function (x) { return x.name.indexOf(query) === 0 || (x.py || '').indexOf(query) === 0; });
      if (s) { var p = wgs2gcj(s.lon, s.lat); map.flyTo([p[1], p[0]], Math.max(map.getZoom(), 8), { duration: .6 }); }
    }
    applyFilter();
  });

  // 余票.info：按当前视野 + 时刻打开它的时刻表回放
  function replayUrl(code) {
    var c = map.getCenter(), z = Math.max(4, Math.min(12, Math.round(map.getZoom())));
    var sel = code ? encodeURIComponent(code) + '&' : '';
    return 'https://www.yupiao.info/#' + sel + 'time=' + clockHM(minutes) +
      '&date=' + dateStr + '&@' + c.lat.toFixed(4) + ',' + c.lng.toFixed(4) + ',' + z + 'z';
  }
  function openReplayFor(code) {
    $('replayFrame').src = replayUrl(code);
    $('controls').style.display = 'none'; $('legend').style.display = 'none';
    $('map').style.visibility = 'hidden';
    $('replayWrap').style.display = 'flex';
    $('modeReplay').classList.add('on');
    $('modeReplay').textContent = '返回地图';
    replayVisible = true;
  }
  function closeReplay() {
    $('replayWrap').style.display = 'none'; $('map').style.visibility = 'visible';
    $('controls').style.display = ''; $('legend').style.display = '';
    $('modeReplay').classList.remove('on');
    $('modeReplay').textContent = '余票回放';
    replayVisible = false;
    map.invalidateSize();
  }
  $('modeReplay').onclick = function () {
    if (replayVisible) closeReplay(); else openReplayFor(selectedTrainCode);
  };
  $('syncView').onclick = function () { $('replayFrame').src = replayUrl(selectedTrainCode); };
  $('replayTime').onchange = function () {
    var p = this.value.split(':'); if (p.length === 2) setTime((+p[0]) * 60 + (+p[1]), true);
    $('replayFrame').src = replayUrl(selectedTrainCode);
  };
  $('replayDate').onchange = function () { dateStr = this.value; $('mapDate').value = dateStr; $('replayFrame').src = replayUrl(selectedTrainCode); };
  // 回放模式下点顶栏徽标返回地图
  document.querySelector('.brand').onclick = closeReplay;
  document.querySelector('.brand').style.cursor = 'pointer';

  // 应用深链：切换车次/换乘方案时先清掉上一次的详情与线路
  function applyDeepLink(clearFirst) {
    if (clearFirst) {
      if (selectedId) closeDetail();
      transferLayer.clearLayers();
      transferMode = false;
      clearRoute();
    }
    if (init.legs && init.legs.length >= 2) openDeepLinkedLegs();
    else if (init.train) openDeepLinkedTrain();
  }
  setTheme(theme);
  loadLines(); loadStations();
  if (/time=/.test(location.hash)) fetchTrains(); else startLive();
  applyDeepLink(false);

  // iframe 只改 hash 时浏览器不会重载文档：监听 hashchange 重新解析并应用
  window.addEventListener('hashchange', function () {
    parseHash();
    init.zoom = Math.max(3, Math.min(12, init.zoom));
    map.setView([init.lat, init.lon], init.zoom, { animate: false });
    dateStr = init.date; $('mapDate').value = dateStr; $('replayDate').value = dateStr;
    if (theme !== init.theme) setTheme(init.theme);
    setTime(init.minutes, false);
    fetchTrains();
    applyDeepLink(true);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && playing) stopPlay();
  });
})();
</script>
</body>
</html>
