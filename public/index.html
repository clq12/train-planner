<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>票路 · 车票路径规划器 - 12306 实时查询</title>
<meta name="description" content="直达没票？换条路走。票路基于 12306 实时数据，一次算出直达 / 候补 / 买长乘短 / 中转换乘 / 同车换乘 / 买短乘长 六种购票方案，并标出最便宜、最快、到得最早的那个。">
<meta name="keywords" content="12306,火车票,余票查询,中转换乘,买长乘短,买短乘长,同车换乘,票路">
<meta property="og:title" content="票路 · 车票路径规划器">
<meta property="og:description" content="直达没票？换条路走。六种购票策略一次算清。">
<meta property="og:type" content="website">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* 票路 · 蓝绿清新主题 */
  --bg:#F2F8FA;--card:#FFFFFF;--card2:#F7FCFD;--card-hover:#E6F4F1;
  --accent:#0F766E;--accent2:#0369A1;--accent3:#0D9488;
  --text:#0F2E36;--text2:#54727D;--text3:#8CA8B2;
  --border:#D8E7EC;--success:#10B981;--warn:#F59E0B;--error:#EF4444;
  --shadow-sm:0 1px 2px rgba(15,46,54,.04);
  --shadow-md:0 1px 2px rgba(15,46,54,.04),0 8px 24px -10px rgba(15,46,54,.14);
}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-wrap:break-word;word-break:normal}
.container{max-width:1100px;margin:0 auto;padding:16px}

.header{text-align:center;padding:28px 0 18px}
.header h1{font-size:1.9em;font-weight:800;background:linear-gradient(135deg,var(--accent),#0F766E,var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.header p{color:var(--text2);font-size:.88em}
.header .badge-live{display:inline-block;background:rgba(16,185,129,.1);color:var(--success);padding:2px 9px;border-radius:10px;font-size:.7em;font-weight:600;margin-top:6px;border:1px solid rgba(16,185,129,.2)}

.search-panel{background:var(--card);border-radius:14px;padding:20px;margin-bottom:16px;border:1px solid var(--border)}
.search-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.search-options{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.opt-check{display:inline-flex;align-items:center;gap:6px;font-size:.85em;color:var(--text);cursor:pointer;user-select:none}
.opt-check input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0}
.opt-hint{font-size:.78em;color:var(--text3)}
/* 指定中转站：搜索面板下方单独一行 */
.via-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.via-row .field{flex:0 1 260px;min-width:170px}
.via-clear{padding:9px 12px;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;color:var(--text2);font-size:.8em;cursor:pointer;white-space:nowrap}
.via-clear:hover{border-color:var(--accent);color:var(--accent)}
.via-hint{font-size:.76em;color:var(--text3);flex:1 1 240px;line-height:1.5}
.via-hint b{color:var(--accent);font-weight:600}
.hub-badge.badge-specified{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid rgba(245,158,11,.35)}
.field{flex:1;min-width:140px;position:relative}
.field label{display:block;font-size:.75em;color:var(--text2);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.field input{width:100%;padding:10px 12px;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-size:.92em;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--text3)}

.station-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--card2);border:1px solid var(--border);border-radius:9px;max-height:220px;overflow-y:auto;z-index:50;display:none;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.station-dropdown.show{display:block}
.station-item{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s;font-size:.85em}
.station-item:hover,.station-item.active{background:rgba(13,148,136,.1)}
.station-item .sname{font-weight:500}.station-item .scode{color:var(--text3);font-size:.75em;margin-left:6px}
.station-item .sdesc{color:var(--text2);font-size:.72em}

.btn-search{padding:10px 24px;background:linear-gradient(135deg,var(--accent),#0F766E);color:#fff;border:none;border-radius:9px;font-size:.92em;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn-search:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(13,148,136,.3)}
.btn-search:active{transform:scale(.97)}
.btn-search:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-swap{padding:7px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.95em;transition:all .2s;align-self:flex-end}
.btn-swap:hover{border-color:var(--accent);color:var(--accent);transform:rotate(180deg)}

.tabs{display:flex;gap:3px;margin-bottom:14px;background:var(--card);border-radius:11px;padding:3px;border:1px solid var(--border)}
.tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:.82em;font-weight:500;cursor:pointer;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){background:var(--card-hover);color:var(--text)}

.strategies{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.strat-tag{padding:4px 11px;border-radius:14px;font-size:.75em;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.strat-tag.active{border-color:var(--accent);color:var(--accent);background:rgba(13,148,136,.08)}
.strat-tag:hover{border-color:var(--accent)}

.stats-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stat-card{flex:1;min-width:90px;background:var(--card);border-radius:9px;padding:10px;border:1px solid var(--border);text-align:center}
.stat-card .num{font-size:1.3em;font-weight:700}.stat-card .label{font-size:.7em;color:var(--text2);margin-top:1px}
.stat-card.s-green .num{color:var(--success)}.stat-card.s-yellow .num{color:var(--accent3)}.stat-card.s-blue .num{color:var(--accent)}

.loading{text-align:center;padding:36px;display:none}.loading.show{display:block}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}

.train-list{display:flex;flex-direction:column;gap:7px}
.train-card{background:var(--card);border-radius:11px;padding:14px;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.train-card:hover{border-color:var(--accent);background:var(--card-hover);transform:translateX(2px)}
.train-card.has-ticket{border-left:3px solid var(--success)}
.train-card.no-ticket{border-left:3px solid var(--text3);opacity:.7}
.train-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.train-no{font-size:1em;font-weight:700;font-family:'SF Mono',Consolas,monospace}
.train-type{padding:2px 7px;border-radius:5px;font-size:.68em;font-weight:600;margin-left:6px}
.type-g{background:rgba(16,185,129,.1);color:var(--success)}.type-d{background:rgba(13,148,136,.1);color:var(--accent)}
.type-k{background:rgba(13,148,136,.1);color:var(--warn)}.type-z{background:rgba(15,118,110,.1);color:#0F766E}
.type-t{background:rgba(245,158,11,.1);color:#0D9488}

.train-times{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.time-block{text-align:center}.time-block .t{font-size:1.2em;font-weight:700;font-family:'SF Mono',Consolas,monospace}
.time-block .s{font-size:.72em;color:var(--text2);margin-top:1px}
.time-arrow{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px}
.time-arrow .dur{font-size:.7em;color:var(--text2)}
.time-arrow .dots{display:flex;gap:2px}.time-arrow .dot{width:3px;height:3px;border-radius:50%;background:var(--text3)}

.seats{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.seat{padding:2px 7px;border-radius:5px;font-size:.7em;background:var(--bg);border:1px solid var(--border)}
.seat.has{border-color:rgba(16,185,129,.3);color:var(--success)}.seat.no{color:var(--text3)}
.seat .stype{color:var(--text2);margin-right:3px}

.timetable{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:none}
.timetable.show{display:block}
.tt-table{width:100%;border-collapse:collapse;font-size:.8em}
.tt-table th{color:var(--text3);font-weight:500;text-align:left;padding:5px 7px;border-bottom:1px solid var(--border)}
.tt-table td{padding:6px 7px;border-bottom:1px solid rgba(15,46,54,.12)}
.tt-table tr:hover td{background:rgba(13,148,136,.04)}
.tt-table .current{color:#0F766E;font-weight:600}
.tt-table .tt-time{font-family:'SF Mono',Consolas,monospace}

.route-card{background:var(--card);border-radius:11px;padding:14px;border:1px solid var(--border);margin-bottom:8px;transition:all .2s}
.route-card:hover{border-color:var(--accent)}
.route-card .route-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.route-card .route-name{font-weight:600;font-size:.92em}
.route-card .route-badge{padding:2px 9px;border-radius:9px;font-size:.7em;font-weight:500}
.badge-direct{background:rgba(16,185,129,.1);color:var(--success)}.badge-transfer{background:rgba(13,148,136,.1);color:var(--warn)}.badge-trick{background:rgba(13,148,136,.1);color:var(--accent)}

.route-trains{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.route-train-chip{padding:3px 9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;font-size:.75em;font-family:'SF Mono',Consolas,monospace;cursor:pointer;transition:all .15s}
.route-train-chip:hover{border-color:var(--accent);color:var(--accent)}
.route-train-chip.has-t{border-color:rgba(16,185,129,.3);color:var(--success)}

.tip-box{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:9px 12px;margin-top:8px;font-size:.8em;color:#0F766E}

.empty-state{text-align:center;padding:44px 20px;color:var(--text2)}
.empty-state .icon{font-size:2.3em;margin-bottom:10px}.empty-state h3{color:var(--text);margin-bottom:4px;font-size:1em}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,46,54,.42);z-index:100;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border-radius:14px;padding:22px;max-width:700px;width:92%;max-height:80vh;overflow-y:auto;border:1px solid var(--border)}
.modal h2{margin-bottom:10px;font-size:1.05em}
.modal-close{float:right;background:none;border:none;color:var(--text2);font-size:1.2em;cursor:pointer}

.progress-bar{margin:12px 0;display:none}.progress-bar.show{display:block}
.progress-bar .bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-bar .bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--success));border-radius:2px;transition:width .3s;width:0}
.progress-bar .p-text{font-size:.72em;color:var(--text2);margin-top:3px;text-align:center}

/* Strategy detail styles */
.strategy-section{margin-bottom:16px}
.strategy-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.strategy-header h3{font-size:.95em}
.strategy-header .count{font-size:.75em;color:var(--text2)}

.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.detail-card{background:var(--card2);border-radius:9px;padding:12px;border:1px solid var(--border)}
.detail-card .train-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.detail-card .train-id{font-family:'SF Mono',Consolas,monospace;font-weight:700;font-size:.9em}
.detail-card .train-status{font-size:.72em;padding:2px 7px;border-radius:5px}
.detail-card .train-status.ok{background:rgba(16,185,129,.1);color:var(--success)}
.detail-card .train-status.no{background:rgba(239,68,68,.1);color:var(--error)}
.detail-card .train-route{font-size:.82em;color:var(--text2);margin-bottom:4px}
.detail-card .train-time{font-size:.85em;font-family:'SF Mono',Consolas,monospace}

/* Sort & Filter Panel */
.sort-filter-panel{background:var(--card);border-radius:11px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.sf-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px}
.sf-row:last-child{margin-bottom:0}
.sf-group{flex:1;min-width:200px}
.sf-label{display:block;font-size:.73em;color:var(--text2);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sort-btns{display:flex;gap:4px;flex-wrap:wrap}
.sort-btn{padding:6px 12px;border-radius:7px;font-size:.78em;cursor:pointer;border:1.5px solid var(--border);background:var(--bg);color:var(--text2);transition:all .2s;font-weight:500}
.sort-btn:hover{border-color:var(--accent);color:var(--accent)}
.sort-btn.active{border-color:var(--accent);color:#fff;background:var(--accent)}
.sort-btn .arrow{font-size:.85em;margin-left:2px}
.time-range{display:flex;align-items:center;gap:6px}
.time-range input[type="time"]{flex:1;padding:7px 10px;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-size:.85em;outline:none;transition:border-color .2s;font-family:'SF Mono',Consolas,monospace}
.time-range input[type="time"]:focus{border-color:var(--accent)}
.range-sep{color:var(--text3);font-size:.8em}
.clear-filter{padding:5px 8px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--text3);cursor:pointer;font-size:.75em;transition:all .2s}
.clear-filter:hover{border-color:var(--error);color:var(--error)}
.filter-chips{display:flex;gap:5px;flex-wrap:wrap}
.filter-chip{display:flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(13,148,136,.08);border:1px solid rgba(13,148,136,.2);border-radius:12px;font-size:.73em;color:var(--accent);font-weight:500}
.filter-chip .chip-x{cursor:pointer;font-size:1.1em;opacity:.6;transition:opacity .15s}
.filter-chip .chip-x:hover{opacity:1}
.filter-count{font-size:.75em;color:var(--text2);margin-left:6px}

@media(max-width:640px){
  .search-row{flex-direction:column}.field{min-width:0;width:100%}.btn-search{width:100%}
  .btn-swap{align-self:center;transform:rotate(90deg)}.btn-swap:hover{transform:rotate(270deg)}
  .header h1{font-size:1.4em}.stats-bar{gap:4px}.stat-card{min-width:60px;padding:6px}
  .train-times{flex-direction:row;gap:6px;flex-wrap:nowrap}.time-arrow{flex:1;min-width:0}
  .time-block{min-width:0;flex-shrink:0}.time-block .t{font-size:1em}
  .train-top{flex-wrap:wrap;gap:4px}
  .detail-grid{grid-template-columns:1fr}
  .sf-row{flex-direction:column}.sf-group{min-width:0;width:100%}
  .sort-btns{flex-wrap:wrap}
  .route-train-chip{display:block;margin-bottom:4px;white-space:normal;word-break:break-all}
}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#C9DEE5;border-radius:3px}

/* 自定义 tooltip — JS 定位，不溢出视口 */
.price-tip{position:relative;display:inline-block}
.price-tip .tip-content{display:none;position:fixed;background:#0F2E36;color:#F2F8FA;padding:10px 14px;border-radius:8px;font-size:.78em;font-weight:400;white-space:nowrap;z-index:200;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.25);line-height:1.8;max-width:320px;white-space:normal;word-break:break-all}
.tip-real{color:#10B981;font-weight:600}.tip-est{color:#F59E0B;font-weight:600}
.tip-row{display:block}

/* 回到顶部按钮 */
.back-to-top{position:fixed;bottom:32px;right:32px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#0F766E);color:#fff;border:none;font-size:1.2em;cursor:pointer;box-shadow:0 4px 16px rgba(13,148,136,.35);opacity:0;transform:translateY(20px);pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;display:flex;align-items:center;justify-content:center}
.back-to-top.show{opacity:1;transform:translateY(0);pointer-events:auto}
.back-to-top:hover{box-shadow:0 6px 24px rgba(13,148,136,.5);transform:translateY(-2px)}
.back-to-top:active{transform:scale(.92)}

/* 换乘双列面板 */
.dual-panel{display:flex;gap:10px}
.dual-panel-leg{flex:1;min-width:0}
.leg-row{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid rgba(15,46,54,.08);font-size:.8em;cursor:pointer;transition:all .15s;flex-wrap:wrap}
.leg-row .lr-no{font-family:monospace;font-weight:700;min-width:52px}
.leg-row .lr-time{font-family:monospace;font-size:.95em}
button.hub-badge{border:none;cursor:pointer;font-family:inherit;transition:transform .12s,box-shadow .12s,outline-color .12s}
button.hub-badge:hover{transform:translateY(-1px);box-shadow:0 1px 4px rgba(0,0,0,.14)}
button.hub-badge.active{outline:2px solid currentColor;outline-offset:1px}
.hub-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.68em;font-weight:600;line-height:1.6;white-space:nowrap}
.badge-price{background:rgba(13,148,136,.16);color:var(--accent)}
.badge-time{background:rgba(16,185,129,.16);color:var(--success)}
.badge-arrive{background:rgba(52,152,219,.16);color:#0284C7}
.leg-row .lr-day{font-family:monospace;font-size:.72em;line-height:1;padding:2px 4px;border-radius:4px;background:rgba(13,148,136,.18);color:var(--accent);font-weight:600;white-space:nowrap}
.leg-row .lr-seats{margin-left:auto;display:flex;flex-wrap:wrap;gap:3px}
.leg-row .lr-price{min-width:45px;text-align:right}
/* 每趟车的真实起终点：12306 会做同城扩展，站名不能只看枢纽名 */
.leg-row .lr-sta{flex-basis:100%;font-size:.72em;color:var(--text2);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-row .lr-sta-diff{color:var(--warn);font-weight:600}
.leg-row.no-ticket{display:none}
.show-all .leg-row.no-ticket{display:flex;opacity:.5}
.show-all .leg-row.no-ticket .lr-no::after{content:'无票';font-size:.65em;color:var(--error);margin-left:4px;font-weight:400}
.hub-ticket-toggle{padding:3px 10px;border-radius:12px;font-size:.72em;cursor:pointer;border:1.5px solid var(--border);background:var(--bg);color:var(--text2);font-weight:600;transition:all .2s}
.hub-ticket-toggle:hover{border-color:var(--accent);color:var(--accent)}
.hub-ticket-toggle.active{border-color:var(--accent);color:var(--accent);background:rgba(13,148,136,.08)}

@media(max-width:640px){
  .dual-panel{flex-direction:column;gap:8px}
  .dual-panel-leg{width:100%}
  .leg-row{font-size:.75em;padding:8px 6px;gap:4px}
  .leg-row .lr-no{min-width:44px;font-size:.9em}
  .leg-row .lr-seats{margin-left:0;width:100%;margin-top:4px}
  .leg-row .lr-price{min-width:auto}
}

/* ===== 票路 · 蓝绿主题视觉精修（只调样式，不动任何交互逻辑） ===== */
body{
  background:
    radial-gradient(1200px 520px at 50% -220px, #E4F3F0 0%, rgba(228,243,240,0) 70%),
    linear-gradient(180deg, #F4FAFB 0%, #EDF6F8 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(13,148,136,.18);color:#0F2E36}

.container{max-width:1120px;padding:18px 16px 40px}

/* 头部：加大留白，标题渐变改为 青→蓝 */
.header{padding:34px 0 22px}
.header h1{font-size:2.05em;letter-spacing:-.3px;line-height:1.25;
  background:linear-gradient(135deg,#0D9488 0%,#0E7490 45%,#0284C7 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--text2);font-size:.9em;margin-top:6px}
.header .badge-live{
  background:rgba(13,148,136,.10);color:#0B7A70;border:1px solid rgba(13,148,136,.18);
  padding:3px 10px;border-radius:999px;font-weight:600;letter-spacing:.2px;
  display:inline-flex;align-items:center;gap:4px;
}

/* 卡片统一：白底 + 冷调柔和投影，替代原来的纯描边 */
.search-panel,.tabs,.detail-card,.route-card,.stat-card,.strat-tag{
  background:var(--card);
  border:1px solid #E3EFF3;
  box-shadow:var(--shadow-md);
}
.search-panel{padding:22px;border-radius:16px;margin-bottom:18px}
.tabs{border-radius:14px;padding:4px;margin-bottom:16px}
.station-dropdown{border-radius:12px;border-color:#E3EFF3;box-shadow:0 12px 32px -12px rgba(15,46,54,.22);background:#fff}
.station-item{border-radius:8px;margin:2px 6px}
.station-item:hover,.station-item.active{background:rgba(13,148,136,.09);color:#0B7A70}

/* 表单控件 */
.field label{color:var(--text2);letter-spacing:.6px;font-weight:600;font-size:.72em}
.field input{background:#fff;border:1.5px solid var(--border);border-radius:10px;transition:border-color .18s,box-shadow .18s}
.field input:hover{border-color:#C2DBE2}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.13);background:#fff}
.opt-check input{accent-color:var(--accent)}
.opt-hint{color:var(--text3)}

/* 主按钮：青→蓝渐变 */
.btn-search{
  background:linear-gradient(135deg,#0D9488 0%,#0E7490 55%,#0284C7 100%);
  border-radius:10px;letter-spacing:.3px;
  box-shadow:0 6px 16px -6px rgba(13,148,136,.55);
}
.btn-search:hover{box-shadow:0 10px 24px -8px rgba(13,148,136,.6);transform:translateY(-1px)}
.btn-search:focus-visible,.btn-swap:focus-visible,.tab:focus-visible,.sort-btn:focus-visible{
  outline:2px solid #0D9488;outline-offset:2px
}
.btn-swap{background:#fff;border:1px solid var(--border);color:var(--text2)}
.btn-swap:hover{border-color:var(--accent);color:var(--accent);background:rgba(13,148,136,.06)}

/* 标签页：选中态用青绿实底 + 轻投影 */
.tabs{background:#fff}
.tab{border-radius:10px;font-weight:600;color:var(--text2);transition:background .18s,color .18s,box-shadow .18s}
.tab:hover:not(.active){background:rgba(13,148,136,.08);color:#0B7A70}
.tab.active{background:linear-gradient(135deg,#0D9488,#0E7490);color:#fff;box-shadow:0 4px 12px -4px rgba(13,148,136,.55)}

/* 进度条 / 统计条 / 分隔层次 */
.progress-bar .bar{background:rgba(13,148,136,.12);border-radius:999px}
.progress-bar .fill{background:linear-gradient(90deg,#0D9488,#0284C7);border-radius:999px}
.stats-bar{border-radius:12px}
.sort-filter-panel{background:#F7FCFD;border:1px solid #E7F2F5;border-radius:12px}
.sort-btn{border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--text2);transition:all .16s}
.sort-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(13,148,136,.06)}
.sort-btn.active{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.45);color:#0B7A70;font-weight:600}
.filter-chip{border-radius:999px}

/* 车次行与卡片：更细的分隔线、悬停青绿高亮 */
.train-card{border-radius:14px;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s,border-color .2s}
.train-card:hover{box-shadow:var(--shadow-md);border-color:#CFE5EB}
.leg-row{transition:background .16s}
.hub-badge{border-radius:999px}
.tip-box{background:#F4FAFB;border-left-color:var(--accent);color:var(--text2);border-radius:0 10px 10px 0}
.route-train-chip{border-radius:999px}
.back-to-top{box-shadow:0 8px 20px -8px rgba(13,148,136,.5)}

/* 滚动条与动效偏好 */
@media (prefers-reduced-motion: no-preference){
  .train-card,.search-panel,.btn-search{will-change:auto}
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CDE3E8;border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#A9CBD4;background-clip:padding-box}

/* 标题：纯文字 + 渐变下划线，避免 emoji 跨平台渲染不一致 */
.header h1{font-size:2.15em;letter-spacing:4px;font-weight:800;padding-bottom:2px}
.header h1::after{
  content:'';display:block;width:46px;height:3px;margin:12px auto 0;border-radius:3px;
  background:linear-gradient(90deg,#0D9488,#0284C7);
}
/* 三个最优标签统一形状与描边，只靠色相区分语义 */
.hub-badge{
  padding:1px 9px;border-radius:999px;border:1px solid transparent;
  font-weight:600;letter-spacing:.2px;line-height:1.7;
}
.badge-price{background:rgba(13,148,136,.10);border-color:rgba(13,148,136,.28);color:#0B7A70}
.badge-time{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.30);color:#0B7A70}
.badge-arrive{background:rgba(3,105,161,.10);border-color:rgba(3,105,161,.26);color:#0369A1}
/* 枢纽内层卡片：更浅的分层，避免和外层白卡“打架” */
.route-card .route-card, .strategy-section div[style*="background:var(--bg)"]{background:#FAFDFE}

/* 副标题两级 */
.header p.sub{font-size:.82em;color:var(--text3);margin-top:2px;letter-spacing:.3px}
/* 空状态：未开始查询时给个引导，避免首屏看起来“空得吓人” */
#trainList:empty::after{
  content:'输入出发站和目的地，点「查询」开始找方案';
  display:block;text-align:center;padding:56px 0;color:var(--text3);
  font-size:.88em;letter-spacing:.4px;
}
#loading.show + #trainList:empty::after{display:none}

/* ===== 移动端排版收紧 ===== */
@media (max-width:640px){
  .header{padding:24px 0 16px}
  .header h1{font-size:1.85em;letter-spacing:3px}
  .header p{font-size:.86em}
  .search-panel{padding:16px;border-radius:14px}
  .search-row{gap:8px;align-items:stretch}
  .field label{margin-bottom:3px}
  .field input{padding:9px 12px}
  /* 交换按钮从竖排中“跳出来”，改成居中的小圆钮 */
  .btn-swap{align-self:center;transform:rotate(90deg);padding:6px 10px;border-radius:999px}
  .btn-swap:hover{transform:rotate(270deg)}
  /* 日期字段在桌面被限制 140px，移动端放宽到整行 */
  .field[style*="max-width:140px"]{max-width:none !important;width:100%}
  .btn-search{width:100%;padding:11px 20px}
  .search-options{gap:8px 14px;margin-top:12px}
  .opt-hint{width:100%;margin-top:2px}
  .via-row .field{flex:1 1 100%}
  .via-hint{width:100%;flex:1 1 100%}
  #trainList:empty::after{padding:40px 12px;font-size:.84em}
}

/* ===== 可读性 & 宽屏利用率优化 ===== */
/* 全站字号基准 16 → 18px，所有 em 尺寸等比放大，小字不再吃力 */
html{font-size:18px}
body{font-size:1rem;line-height:1.6}

/* 主容器加宽：1600 宽屏两侧留白从 240px 收到 ~140px */
.container{max-width:1320px;padding:22px 24px 48px}

/* 直达车次列表：宽屏下改为两列，避免单列过长、两侧空 */
/* 双列显示由左上角开关控制（默认单列） */
body.two-col .train-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
body.two-col .train-list:empty::after{grid-column:1 / -1}
/* 更宽的屏幕上再放宽一点 */
@media (min-width:1560px){
  .container{max-width:1460px}
}
@media (min-width:1800px){
  .container{max-width:1620px}
}

/* 局部小字微调，避免放大后仍偏小 */
.field label{font-size:.8em}
.opt-hint{font-size:.86em}
.opt-check{font-size:.92em}
.station-item .sdesc{font-size:.78em}
.header p.sub{font-size:.86em}

/* 移动端不受基准放大影响过多，略收回 */
@media (max-width:640px){
  html{font-size:16px}
  .container{padding:16px 14px 32px}
}

/* 搜索行比例：两个站名等宽，日期固定，交换按钮居中 */
.search-row .field{flex:1 1 260px}
.field[style*="max-width:140px"]{flex:0 0 180px;max-width:180px !important}
.btn-swap{align-self:center;margin:0 2px}
/* 时间筛选输入框不要被拉满整行 */
.time-range input[type="time"]{max-width:120px}
.sf-row .sf-group{flex:1 1 240px}
/* 统计卡在宽屏下不要过高 */
.stats-bar{align-items:stretch}
.stat-card{padding:12px 14px}
.stat-card .num{font-size:1.45em}
.stat-card .label{font-size:.76em}

/* 搜索字段等宽 + 筛选行两列对齐 */
.search-row .field{flex:1 1 0;min-width:170px}
.sf-row:has(.sf-group){display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:760px){
  .sf-row:has(.sf-group){grid-template-columns:1fr}
}

/* 移动端：日期字段必须与其他输入框同宽（放在最后，确保覆盖桌面规则） */
@media (max-width:640px){
  .search-row .field,
  .search-row .field[style*="max-width"]{
    flex:1 1 auto !important;
    width:100% !important;
    max-width:100% !important;
  }
}

/* ===== 阅读设置：字号滑块 + 老年人模式 ===== */
.header{position:relative}
.a11y-bar{
  position:absolute;right:0;top:4px;display:flex;align-items:center;gap:18px;
  background:rgba(255,255,255,.9);border:1px solid #E3EFF3;border-radius:999px;
  padding:7px 16px;box-shadow:var(--shadow-sm);
}
.a11y-switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.a11y-switch input{position:absolute;opacity:0;width:0;height:0}
.a11y-track{width:38px;height:22px;border-radius:999px;background:#D8E7EC;position:relative;transition:background .18s}
.a11y-dot{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(15,46,54,.25);transition:transform .18s}
.a11y-switch input:checked + .a11y-track{background:linear-gradient(135deg,#0D9488,#0284C7)}
.a11y-switch input:checked + .a11y-track .a11y-dot{transform:translateX(16px)}
.a11y-switch input:focus-visible + .a11y-track{outline:2px solid #0F766E;outline-offset:2px}
.a11y-font{display:inline-flex;align-items:center;gap:9px}
.a11y-txt{font-size:.78em;color:var(--text2);white-space:nowrap}
.a11y-txt b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.a11y-bar input[type=range]{width:118px;accent-color:#0F766E;cursor:pointer}
.a11y-bar input[type=range]:disabled{accent-color:#B4C6CC;opacity:.45;cursor:not-allowed}
.a11y-bar .a11y-font:has(input:disabled){opacity:.5}

/* 窄屏：仍然固定在右上角，只是缩小 + 给标题让出上边距 */
@media (max-width:1024px){
  .a11y-bar{top:0;right:0;gap:12px;padding:8px 12px;border-radius:14px}
  .a11y-bar input[type=range]{width:120px}
  .a11y-txt{font-size:.74em}
  .header{padding-top:58px}
}
@media (max-width:430px){
  /* 超窄屏隐藏品牌前缀，避免“走”字单独掉一行 */
  .hdr-prefix{display:none}
  .header p{font-size:.82em;line-height:1.5}
  .header p.sub{font-size:.74em}
  .a11y-bar{gap:9px;padding:6px 10px;border-radius:12px}
  .a11y-bar input[type=range]{width:88px}
  .a11y-txt{font-size:.7em}
  .a11y-track{width:34px;height:20px}
  .a11y-dot{width:14px;height:14px}
  .a11y-switch input:checked + .a11y-track .a11y-dot{transform:translateX(14px)}
  .header{padding-top:54px}
}

/* ===== 老年人模式：超大字号 + 宽松排版 + 高对比 ===== */
body.elder{--text:#08171C;--text2:#2C4E58;--text3:#41666F;--border:#B6D2DA;--bg:#F7FCFD;line-height:1.95}
body.elder .container{max-width:1180px;padding:26px 22px 64px}
body.elder .header{padding:30px 0 20px}
body.elder .header h1{font-size:2.35em;letter-spacing:6px}
body.elder .header h1::after{width:60px;height:4px}
body.elder .search-panel{padding:26px;border-radius:18px;margin-bottom:22px}
body.elder .field label{font-size:.86em;color:#2C4E58}
body.elder .field input{padding:13px 14px;font-size:1em;border-width:2px}
body.elder .opt-check{font-size:1em}
body.elder .btn-search{padding:14px 26px;font-size:1em}
body.elder .field[style*="max-width"]{flex:0 0 250px;max-width:260px !important}
body.elder .opt-check input{width:20px;height:20px}
body.elder .a11y-switch{font-size:1em}
/* 简化布局：单列、隐藏次要说明与高级筛选 */
body.elder .train-list{display:block}
body.elder .train-card{padding:20px 22px;margin-bottom:16px;border-width:1.5px;border-color:#C3DBE3}
body.elder .leg-row{font-size:.95em;padding:9px 10px}
body.elder .sort-filter-panel .sf-row:has(input[type="time"]),
body.elder .opt-hint,
body.elder .badge-live,
body.elder .header p.sub,
body.elder .filter-chips{display:none}
body.elder .sort-filter-panel{padding:14px;border-width:1.5px}
body.elder .sort-btn{padding:8px 14px;font-size:.95em}
body.elder .tabs{padding:5px}
body.elder .tab{padding:12px;font-size:.95em}
body.elder .stat-card{padding:14px}
body.elder .stat-card .num{font-size:1.6em}
body.elder .stat-card .label{font-size:.85em}
body.elder .strategy-section{padding:18px}
body.elder .hub-badge{font-size:.85em;padding:3px 10px}
body.elder .tip-content{font-size:.95em}

/* 交换按钮：与输入框同构（占位 label），保证与输入框垂直居中对齐 */
.field-swap{flex:0 0 auto !important;min-width:0 !important;width:auto !important;
  display:flex;flex-direction:column;align-self:stretch}
.field-swap label{visibility:hidden}
.field-swap .btn-swap{flex:1 1 auto;align-self:stretch;display:inline-flex;align-items:center;justify-content:center;
  padding:0 12px;margin:0;font-size:1em;line-height:1}
@media (max-width:640px){
  .field-swap{flex-direction:row;justify-content:center;width:100% !important;align-self:auto}
  .field-swap label{display:none}
  .field-swap .btn-swap{flex:0 0 auto;align-self:center;width:44px;height:44px;padding:0;margin:4px auto;
    border-radius:50%;transform:rotate(90deg)}
}

/* ===== 左上角：单列 / 双列 切换 ===== */
.layout-bar{
  position:absolute;left:0;top:4px;display:inline-flex;align-items:center;gap:2px;
  background:rgba(255,255,255,.9);border:1px solid #E3EFF3;border-radius:999px;
  padding:4px;box-shadow:var(--shadow-sm);
}
.layout-btn{
  border:none;background:transparent;color:var(--text2);cursor:pointer;
  font-family:inherit;font-size:.78em;font-weight:600;letter-spacing:.5px;
  padding:5px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;
  transition:background .16s,color .16s,box-shadow .16s;
}
.layout-btn svg{opacity:.75}
.layout-btn:hover:not(.active){background:rgba(13,148,136,.08);color:#0B7A70}
.layout-btn.active{background:linear-gradient(135deg,#0D9488,#0283C7);color:#fff;box-shadow:0 3px 10px -4px rgba(13,148,136,.6)}
.layout-btn.active svg{opacity:1}
.layout-btn:focus-visible{outline:2px solid #0F766E;outline-offset:2px}

/* 窄屏（两列会挤）与老年人模式下隐藏该开关，并强制单列 */
@media (max-width:899px){
  .layout-bar{display:none}
  body.two-col .train-list{display:block}
}
body.elder .layout-bar{display:none}
body.elder .train-list{display:block !important}

/* 单列模式：整列收窄（搜索面板/统计条/车次卡统一宽度，边缘对齐） */
body:not(.two-col) .container{max-width:1080px}
body.elder .container{max-width:980px !important}
/* 单列时把"时间轴"收住，避免中间的虚线被拉成一条长横线 */
body:not(.two-col) .train-times{justify-content:space-between}
body:not(.two-col) .time-arrow{flex:0 0 190px}
body:not(.two-col) .time-arrow .dots{justify-content:space-between;width:100%}

/* 「无衔接」标记：提示这趟车接不上任何第二段，避免误以为"更便宜却没被选中" */
.lr-noconn{font-size:.66em;color:#7A8F97;background:rgba(15,46,54,.05);
  border:1px solid var(--border);border-radius:6px;padding:0 5px;margin-right:2px;white-space:nowrap}
.leg-row:has(.lr-noconn){opacity:.62}
</style>

<body>
<div class="container">
  <div class="header">
    <h1>票路</h1>
    <p><span class="hdr-prefix">车票路径规划器 · </span>直达没票，换条路走</p>
    <p class="sub">12306 实时数据 · 六种购票策略</p>
    <span class="badge-live">● 接入12306实时数据</span>

    <div class="layout-bar" role="group" aria-label="列表布局">
      <button class="layout-btn active" data-cols="1" aria-pressed="true">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1.5" width="10" height="3.2" rx="1" fill="currentColor"/><rect x="1" y="7.3" width="10" height="3.2" rx="1" fill="currentColor"/></svg>单列
      </button>
      <button class="layout-btn" data-cols="2" aria-pressed="false">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1.5" width="4.4" height="9" rx="1" fill="currentColor"/><rect x="6.6" y="1.5" width="4.4" height="9" rx="1" fill="currentColor"/></svg>双列
      </button>
    </div>

    <div class="a11y-bar" role="group" aria-label="阅读设置">
      <label class="a11y-switch" title="开启后使用超大字号、更宽行距、更大间距，字号滑块不可用">
        <input type="checkbox" id="elderMode">
        <span class="a11y-track"><span class="a11y-dot"></span></span>
        <span class="a11y-txt">老年人模式</span>
      </label>
      <div class="a11y-font">
        <span class="a11y-txt">字号 <b id="fontVal">18</b></span>
        <input type="range" id="fontRange" min="16" max="24" step="1" value="18" aria-label="正文字号（16 到 24）">
      </div>
    </div>
  </div>

  <div class="search-panel">
    <div class="search-row">
      <div class="field">
        <label>出发站</label>
        <input type="text" id="fromInput" placeholder="输入站名或拼音" autocomplete="off">
        <div class="station-dropdown" id="fromDropdown"></div>
        <input type="hidden" id="fromCode">
      </div>
      <div class="field field-swap">
        <label aria-hidden="true">&nbsp;</label>
        <button class="btn-swap" onclick="swapStations()" title="交换出发/到达">⇄</button>
      </div>
      <div class="field">
        <label>到达站</label>
        <input type="text" id="toInput" placeholder="输入站名或拼音" autocomplete="off">
        <div class="station-dropdown" id="toDropdown"></div>
        <input type="hidden" id="toCode">
      </div>
      <div class="field" style="max-width:140px">
        <label>出发日期</label>
        <input type="date" id="travelDate">
      </div>
      <button class="btn-search" id="btnSearch" onclick="doSearch()">🔍 查询</button>
    </div>
    <div class="search-options">
      <label class="opt-check" title="勾选后，选温州南会同时查温州、温州北、瑞安等同城所有站">
        <input type="checkbox" id="useCityFrom" checked>
        <span>市内出发</span>
      </label>
      <label class="opt-check" title="取消勾选则查全部枢纽，覆盖更全但耗时约翻倍">
        <input type="checkbox" id="useCommonHubs" checked>
        <span>使用 20 个常见枢纽</span>
      </label>
      <label class="opt-check" title="取消勾选则跳过买长乘短 / 买短乘长，查询更省时">
        <input type="checkbox" id="useShortLong" checked>
        <span>计算买长乘短 / 买短乘长</span>
      </label>

<script>
let allStations = {};
let stationList = [];
let currentTrains = [];
let currentTab = 'direct';

// ========== 车站搜索 ==========
async function loadStations() {
  try {
    const r = await fetch('/api/stations');
    const d = await r.json();
    if (d.status === 0) {
      allStations = d.data;
      stationList = Object.values(allStations).sort((a, b) => a.index - b.index);
    }
  } catch (e) { console.error('加载车站失败:', e); }
}

function setupStationInput(inputId, dropdownId, codeId) {
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  let activeIdx = -1;

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    document.getElementById(codeId).value = '';
    if (!q) { dropdown.classList.remove('show'); return; }

    // 模糊搜索：中文名、拼音全拼、拼音首字母、车站编码，全部用 includes
    let matches = stationList.filter(s => {
      const name = s.name.toLowerCase();
      const pinyin = s.pinyin.toLowerCase();
      const pinyinShort = s.pinyinShort.toLowerCase();
      const code = s.code.toLowerCase();
      return name.includes(q) || pinyin.includes(q) || pinyinShort.includes(q) || code.includes(q);
    });

    // 按相关性排序：前缀匹配 > 包含匹配；短名优先
    matches.sort((a, b) => {
      const aName = a.name.toLowerCase();
      const bName = b.name.toLowerCase();
      const aPinyin = a.pinyin.toLowerCase();
      const bPinyin = b.pinyin.toLowerCase();
      const aShort = a.pinyinShort.toLowerCase();
      const bShort = b.pinyinShort.toLowerCase();

      // 1. 中文名前缀匹配优先
      const aNamePrefix = aName.startsWith(q) ? 0 : 1;
      const bNamePrefix = bName.startsWith(q) ? 0 : 1;
      if (aNamePrefix !== bNamePrefix) return aNamePrefix - bNamePrefix;

      // 2. 拼音前缀匹配优先
      const aPinyinPrefix = aPinyin.startsWith(q) ? 0 : 1;
      const bPinyinPrefix = bPinyin.startsWith(q) ? 0 : 1;
      if (aPinyinPrefix !== bPinyinPrefix) return aPinyinPrefix - bPinyinPrefix;

      // 3. 短名优先（"北京站"排在"北京朝阳"前面）
      if (aName.length !== bName.length) return aName.length - bName.length;

      // 4. 按索引（热门站点优先）
      return a.index - b.index;
    }).slice(0, 20);

    if (!matches.length) { dropdown.classList.remove('show'); return; }
    activeIdx = -1;
    dropdown.innerHTML = matches.map(s => {
      // 高亮匹配的文字
      const nameHtml = highlightMatch(s.name, q);
      const pinyinHtml = highlightMatch(s.pinyin, q);
      const safeCode = escapeHTML(s.code);
      const safeName = escapeHTML(s.name);
      return `<div class="station-item" onclick="selStation('${inputId}','${dropdownId}','${codeId}','${safeCode}','${safeName}')">
        <span><span class="sname">${nameHtml}</span><span class="scode">${safeCode}</span></span>
        <span class="sdesc">${pinyinHtml}</span>
      </div>`;
    }).join('');
    dropdown.classList.add('show');
  });

  input.addEventListener('keydown', (e) => {
    const items = dropdown.querySelectorAll('.station-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx+1, items.length-1); items.forEach((it,i)=>it.classList.toggle('active',i===activeIdx)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); items.forEach((it,i)=>it.classList.toggle('active',i===activeIdx)); }
    else if (e.key === 'Enter' && activeIdx >= 0 && items[activeIdx]) { items[activeIdx].click(); e.preventDefault(); }
    else if (e.key === 'Escape') { dropdown.classList.remove('show'); }
  });

  input.addEventListener('focus', () => { if (input.value.trim()) input.dispatchEvent(new Event('input')); });
  document.addEventListener('click', e => { if (!e.target.closest('.field')) dropdown.classList.remove('show'); });
}

// HTML 转义（防 XSS）
function escapeHTML(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// 高亮匹配文字
function highlightMatch(text, query) {
  if (!query) return escapeHTML(text);
  const lowerText = text.toLowerCase();
  const lowerQuery = query.toLowerCase();
  const idx = lowerText.indexOf(lowerQuery);
  if (idx < 0) return escapeHTML(text);
  const before = escapeHTML(text.slice(0, idx));
  const match = escapeHTML(text.slice(idx, idx + query.length));
  const after = escapeHTML(text.slice(idx + query.length));
  return `${before}<span style="color:var(--accent);font-weight:600">${match}</span>${after}`;
}

function selStation(inputId, dropdownId, codeId, code, name) {
  document.getElementById(inputId).value = name;
  document.getElementById(codeId).value = code;
  document.getElementById(dropdownId).classList.remove('show');
  if (inputId === 'viaInput') updateViaUI();
}

function swapStations() {
  const fi=document.getElementById('fromInput'),ti=document.getElementById('toInput');
  const fc=document.getElementById('fromCode'),tc=document.getElementById('toCode');
  [fi.value,ti.value]=[ti.value,fi.value]; [fc.value,tc.value]=[tc.value,fc.value];
}

// ========== Tabs ==========
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    const tabs = ['direct','strategy','schedule'];
    t.classList.toggle('active', tabs[i]===tab);
  });
  document.getElementById('tabDirect').style.display = tab==='direct'?'':'none';
  document.getElementById('tabStrategy').style.display = tab==='strategy'?'':'none';
  document.getElementById('tabSchedule').style.display = tab==='schedule'?'':'none';
}

// ========== Progress ==========
function showProgress(text, pct) {
  const bar = document.getElementById('progressBar');
  bar.classList.add('show');
  document.getElementById('progressText').textContent = text;
  document.getElementById('progressFill').style.width = pct + '%';
}
function hideProgress() { document.getElementById('progressBar').classList.remove('show'); }

// 按文字解析车站（精确名优先 → 名称前缀 → 拼音前缀/简拼 → 短名优先）
function pickStationByText(text) {
  const q = String(text || '').trim();
  if (!q) return null;
  const ql = q.toLowerCase();
  const list = Object.values(allStations);
  const exact = list.find(s => s.name === q);
  if (exact) return exact;
  const cands = list.filter(s =>
    s.name.startsWith(q) || s.pinyin.startsWith(ql) || s.pinyinShort === ql
  );
  if (!cands.length) return null;
  cands.sort((a, b) =>
    (a.name.startsWith(q) ? 0 : 1) - (b.name.startsWith(q) ? 0 : 1) ||
    a.name.length - b.name.length ||
    a.index - b.index
  );
  return cands[0];
}

// 把输入框文字与隐藏的站码对齐：
// 用户手动改过文字（没点下拉项）时，站码还停在上一次选择，会查错站。
function syncStationInputs() {
  ['from', 'to'].forEach(function (k) {
    const input = document.getElementById(k + 'Input');
    const codeEl = document.getElementById(k + 'Code');
    const text = (input.value || '').trim();
    if (!text) return;
    const byCode = Object.values(allStations).find(s => s.code === codeEl.value);
    if (byCode && byCode.name === text) return;   // 文字与站码一致，不动
    const hit = pickStationByText(text);
    if (hit) {
      input.value = hit.name;
      codeEl.value = hit.code;
    }
  });
}

// ========== 主搜索 ==========
async function doSearch() {
  syncStationInputs();
  if (!syncViaInput()) {
    alert('指定中转站「' + viaName() + '」不是有效车站，请从下拉列表里选一个，或点「✕ 清除」留空');
    return;
  }
  const fromCode = document.getElementById('fromCode').value;
  const toCode = document.getElementById('toCode').value;
  const fromName = document.getElementById('fromInput').value;
  const toName = document.getElementById('toInput').value;
  const date = document.getElementById('travelDate').value;

  if (!fromCode || !toCode) { alert('请选择有效的车站'); return; }
  if (fromCode === toCode) { alert('出发站和到达站不能相同'); return; }
  if (!date) { alert('请选择出发日期'); return; }

  const btn = document.getElementById('btnSearch');
  btn.disabled = true; btn.textContent = '⏳ 查询中...';
  document.getElementById('loading').classList.add('show');
  document.getElementById('trainList').innerHTML = '';
  document.getElementById('statsBar').style.display = 'none';

  try {
    showProgress('正在查询12306直达车次...', 20);
    const resp = await fetch(`/api/ticket?from=${fromCode}&to=${toCode}&date=${date}${cityParam()}`);
    const data = await resp.json();

    if (data.status === 0 && data.data) {
      currentTrains = data.data;
      const availCount = data.availableCount || 0;
      const totalCount = data.totalCount || currentTrains.length;
      showProgress(`查到 ${totalCount} 个车次，${availCount} 个有票，正在分析...`, 50);

      // 重置排序和筛选
      currentSort = 'time';
      sortAsc = true;
      trainTypeFilter = 'all';
      document.getElementById('filterDepStart').value = '';
      document.getElementById('filterDepEnd').value = '';
      document.getElementById('filterArrStart').value = '';
      document.getElementById('filterArrEnd').value = '';
      document.querySelectorAll('#sortBtns .sort-btn').forEach(btn => {
        const labels = {time:'出发时间',arrive:'到达时间',duration:'耗时',price:'价格'};
        btn.innerHTML = `${labels[btn.dataset.sort]} ↑`;
        btn.classList.toggle('active', btn.dataset.sort === 'time');
      });
      document.getElementById('sortFilterPanel').style.display = '';
      document.getElementById('activeFilters').style.display = 'none';

      // 默认只显示有票的车次，如果没有任何有票车次则显示全部
      const withTickets = currentTrains.filter(t => t.canBuy && hasTicket(t));
      const displayTrains = withTickets.length > 0 ? withTickets : currentTrains;
      renderTrainList(displayTrains, fromName, toName, date, withTickets.length > 0);

      showProgress('正在计算多策略方案...', 70);
      try {
        await computeStrategies(currentTrains, fromCode, toCode, fromName, toName, date);
      } catch (e) {
        console.error('computeStrategies error:', e);
        renderStrategies([]);
      }
      showProgress('完成！', 100);
      setTimeout(hideProgress, 800);
    } else {
      hideProgress();
      document.getElementById('trainList').innerHTML =
        `<div class="empty-state"><div class="icon">😕</div><h3>未查到车次</h3><p>${data.error||'请检查站点和日期'}</p></div>`;
    }
  } catch (e) {
    hideProgress();
    document.getElementById('trainList').innerHTML =
      `<div class="empty-state"><div class="icon">⚠️</div><h3>查询失败</h3><p>${e.message}</p></div>`;
  }

  btn.disabled = false; btn.textContent = '🔍 查询';
  document.getElementById('loading').classList.remove('show');
}

// ========== 渲染直达车次 ==========
function renderTrainList(trains, fromName, toName, date, onlyAvailable) {
  const allCanBuy = currentTrains.filter(t => t.canBuy && hasTicket(t)).length;
  const types = {};
  const displayList = onlyAvailable ? trains : currentTrains;
  displayList.forEach(t => {
    const tp = trainType(t.trainNo);
    const labels = {g:'高铁G',d:'动车D',k:'快速K',z:'直达Z',t:'特快T'};
    if (!types[tp]) types[tp] = {label:labels[tp]||tp, count:0};
    types[tp].count++;
  });

  document.getElementById('filterTags').innerHTML =
    `<div class="strat-tag ${onlyAvailable?'active':''}" onclick="filterTrains('canbuy',this)">有票 (${allCanBuy})</div>` +
    `<div class="strat-tag ${!onlyAvailable?'active':''}" onclick="filterTrains('all',this)">全部 (${currentTrains.length})</div>` +
    Object.entries(types).map(([k,v]) =>
      `<div class="strat-tag" onclick="filterTrains('${k}',this)">${v.label} (${v.count})</div>`
    ).join('');

  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card s-green"><div class="num">${allCanBuy}</div><div class="label">有票车次</div></div>
    <div class="stat-card s-blue"><div class="num">${currentTrains.length}</div><div class="label">总车次</div></div>
    <div class="stat-card s-yellow"><div class="num">${fromName}→${toName}</div><div class="label">${date}</div></div>`;
  // 通过 applyFilters 统一处理排序和筛选
  applyFilters();
}

let trainTypeFilter = 'all'; // 'all', 'canbuy', or specific type like 'g', 'd', etc.

function filterTrains(f, el) {
  document.querySelectorAll('#filterTags .strat-tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  trainTypeFilter = f;
  applyFiltersWithTrainType();
}

function applyFiltersWithTrainType() {
  const depStart = document.getElementById('filterDepStart').value;
  const depEnd = document.getElementById('filterDepEnd').value;
  const arrStart = document.getElementById('filterArrStart').value;
  const arrEnd = document.getElementById('filterArrEnd').value;

  let filtered = [...currentTrains];
  const chips = [];

  // 车次类型筛选
  if (trainTypeFilter === 'canbuy') {
    filtered = filtered.filter(t => t.canBuy && hasTicket(t));
  } else if (trainTypeFilter !== 'all') {
    filtered = filtered.filter(t => trainType(t.trainNo) === trainTypeFilter);
  }

  // 出发时间筛选
  if (depStart || depEnd) {
    const startMin = depStart ? timeToMinutes(depStart) : 0;
    const endMin = depEnd ? timeToMinutes(depEnd) : 1440;
    if (startMin <= endMin) {
      filtered = filtered.filter(t => {
        const m = timeToMinutes(t.startTime);
        return m >= startMin && m <= endMin;
      });
    } else {
      filtered = filtered.filter(t => {
        const m = timeToMinutes(t.startTime);
        return m >= startMin || m <= endMin;
      });
    }
    const label = `出发 ${depStart || '00:00'} ~ ${depEnd || '24:00'}`;
    chips.push({ label, type: 'dep' });
  }

  // 到达时间筛选
  if (arrStart || arrEnd) {
    const startMin = arrStart ? timeToMinutes(arrStart) : 0;
    const endMin = arrEnd ? timeToMinutes(arrEnd) : 1440;
    if (startMin <= endMin) {
      filtered = filtered.filter(t => {
        const m = timeToMinutes(t.arriveTime);
        return m >= startMin && m <= endMin;
      });
    } else {
      filtered = filtered.filter(t => {
        const m = timeToMinutes(t.arriveTime);
        return m >= startMin || m <= endMin;
      });
    }
    const label = `到达 ${arrStart || '00:00'} ~ ${arrEnd || '24:00'}`;
    chips.push({ label, type: 'arr' });
  }

  // 排序
  filtered.sort((a, b) => {
    let cmp = 0;
    switch (currentSort) {
      case 'time':
        cmp = timeToMinutes(a.startTime) - timeToMinutes(b.startTime);
        break;
      case 'arrive':
        cmp = timeToMinutes(a.arriveTime) - timeToMinutes(b.arriveTime);
        break;
      case 'duration':
        const da = (a.duration || '99:99').split(':');
        const db = (b.duration || '99:99').split(':');
        cmp = (parseInt(da[0]) * 60 + parseInt(da[1])) - (parseInt(db[0]) * 60 + parseInt(db[1]));
        break;
      case 'price':
        cmp = estimatePrice(a) - estimatePrice(b);
        break;
    }
    return sortAsc ? cmp : -cmp;
  });

  // 更新筛选标签
  const chipsEl = document.getElementById('activeFilters');
  const chipsListEl = document.getElementById('filterChips');
  if (chips.length > 0) {
    chipsEl.style.display = '';
    chipsListEl.innerHTML = chips.map(c =>
      `<span class="filter-chip">${c.label}<span class="chip-x" onclick="clearTimeFilter('${c.type}')">✕</span></span>`
    ).join('') + `<span class="filter-count">显示 ${filtered.length}/${currentTrains.length} 车次</span>`;
  } else {
    chipsEl.style.display = 'none';
  }

  renderTrainCards(filtered);
}

// ========== 排序与筛选 ==========
let currentSort = 'time';
let sortAsc = true;

// ========== 价格估算系统 ==========
// 基于12306实际定价规律（备用估算，当 yp_ex_str 无数据时使用）：
//   G 高铁二等座 ≈ 0.46元/km，一等座 ≈ 1.6倍，商务座 ≈ 3.2倍
//   C 城际二等座 ≈ 0.46元/km（平均速度较低，停站较多）
//   D 动车二等座 ≈ 0.31元/km，一等座 ≈ 1.5倍
//   K/Z/T 普速硬座 ≈ 0.11元/km，硬卧 ≈ 1.6倍，软卧 ≈ 2.6倍
// 距离通过 耗时×平均时速 估算

function estimateBasePrice(t) {
  // 返回二等座/硬座的基准价格（估算值，仅在真实票价不可用时使用）
  const tp = trainType(t.trainNo);
  const durParts = (t.duration || '0:00').split(':');
  const durMins = parseInt(durParts[0], 10) * 60 + parseInt(durParts[1], 10);
  if (tp === 'g') {
    return Math.round(durMins * 200 * 0.46 / 60);
  } else if (tp === 'c') {
    return Math.round(durMins * 160 * 0.46 / 60);
  } else if (tp === 'd') {
    return Math.round(durMins * 160 * 0.31 / 60);
  } else {
    return Math.round(durMins * 80 * 0.11 / 60);
  }
}

// 席别价格倍率（备用，当后端未解析到真实票价时使用）
const SEAT_MULTIPLIERS = {
  g: { business: 3.2, first: 1.6, second: 1.0 },
  d: { business: 3.2, first: 1.5, second: 1.0 },
  k: { softSleep: 2.6, hardSleep: 1.6, hardSeat: 1.0, noSeat: 0.75 },
  z: { softSleep: 2.6, hardSleep: 1.6, hardSeat: 1.0, noSeat: 0.75 },
  t: { softSleep: 2.6, hardSleep: 1.6, hardSeat: 1.0, noSeat: 0.75 },
  other: { softSleep: 2.6, hardSleep: 1.6, hardSeat: 1.0, noSeat: 0.75 },
};

// 返回各席别的价格 { seatName: price }
// 优先使用12306真实票价（后端从 yp_ex_str 解析），无数据时用估算
function estimateAllPrices(t) {
  // 如果有真实票价，直接使用
  if (t.prices && Object.keys(t.prices).length > 0) {
    return t.prices;
  }
  // 否则用估算
  const tp = trainType(t.trainNo);
  const base = estimateBasePrice(t);
  const mult = SEAT_MULTIPLIERS[tp] || SEAT_MULTIPLIERS.other;
  const prices = {};
  for (const [seat, m] of Object.entries(mult)) {
    prices[seat] = Math.round(base * m);
  }
  return prices;
}

// 获取最低可用席位的价格
function getMinAvailablePrice(t) {
  const prices = estimateAllPrices(t);
  const checks = [
    {key:'second', val:t.second}, {key:'hardSeat', val:t.hardSeat}, {key:'noSeat', val:t.noSeat},
    {key:'first', val:t.first}, {key:'business', val:t.business},
    {key:'hardSleep', val:t.hardSleep}, {key:'softSleep', val:t.softSleep},
  ];
  let minPrice = Infinity;
  for (const c of checks) {
    if (prices[c.key] && c.val && c.val !== '无' && c.val !== '--' && c.val !== '') {
      if (prices[c.key] < minPrice) minPrice = prices[c.key];
    }
  }
  return minPrice === Infinity ? estimateBasePrice(t) : minPrice;
}

// 生成价格tooltip HTML（所有可用席位价格，用于自定义tooltip）
function priceTooltipHTML(t) {
  const prices = estimateAllPrices(t);
  const isReal = t.prices && Object.keys(t.prices).length > 0;
  const labels = {
    business:'商务座', first:'一等座', second:'二等座',
    softSleep:'软卧', hardSleep:'硬卧', hardSeat:'硬座', noSeat:'无座',
    special:'特等座', highSoft:'高级软卧'
  };
  const checks = [
    {key:'business', val:t.business}, {key:'first', val:t.first}, {key:'second', val:t.second},
    {key:'softSleep', val:t.softSleep}, {key:'hardSleep', val:t.hardSleep},
    {key:'hardSeat', val:t.hardSeat}, {key:'noSeat', val:t.noSeat},
  ];
  const rows = [];
  for (const c of checks) {
    if (prices[c.key] && c.val && c.val !== '无' && c.val !== '--' && c.val !== '') {
      rows.push('<span class="tip-row">' + labels[c.key] + ': ¥' + prices[c.key] + '</span>');
    }
  }
  const cls = isReal ? 'tip-real' : 'tip-est';
  const prefix = isReal ? '💰 12306实际票价' : '⚠️ 估算价格';
  return '<span class="' + cls + '">' + prefix + '</span>' + rows.join('');
}

// 向后兼容：estimatePrice 返回最低可用价格
function estimatePrice(t) {
  return getMinAvailablePrice(t);
}


// ========== 受限并发执行 ==========
// 浏览器端同时最多发 CONCURRENT_QUERIES 个请求：比串行快数倍，又不会把
// 后端和 12306 打爆（后端还有自己的并发池兜底）。结果按原顺序返回。
const CONCURRENT_QUERIES = 4;

async function mapLimit(items, limit, worker) {
  const out = new Array(items.length);
  let cursor = 0;
  const runners = [];
  const n = Math.min(limit, items.length);
  for (let r = 0; r < n; r++) {
    runners.push((async () => {
      while (true) {
        const i = cursor++;
        if (i >= items.length) return;
        out[i] = await worker(items[i], i);
      }
    })());
  }
  await Promise.all(runners);
  return out;
}
function timeToMinutes(t) {
  if (!t) return 0;
  const parts = t.split(':');
  return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}

async function showBuyLong(trainNo, trainCode) {
  const fromCode = document.getElementById('fromCode').value;
  const toCode = document.getElementById('toCode').value;
  const fromName = document.getElementById('fromInput').value;
  const toName = document.getElementById('toInput').value;
  const date = document.getElementById('travelDate').value;

  const m = document.getElementById('modal');
  const c = document.getElementById('modalContent');
  c.innerHTML = `<button class="modal-close" onclick="closeModal()">✕</button>
    <h2>🎯 买长乘短 - ${trainNo}</h2>
    <div class="loading show"><div class="spinner"></div><p style="color:var(--text2)">正在查询更远站点的余票...</p></div>`;
  m.classList.add('show');

  try {
    const sr = await fetch(`/api/schedule?trainNo=${trainCode}&date=${date}&fromCode=${fromCode}&toCode=${toCode}`);
    const sd = await sr.json();
    if (sd.status !== 0 || !sd.data) {
      c.innerHTML = `<button class="modal-close" onclick="closeModal()">✕</button>
        <h2>🎯 买长乘短 - ${escapeHTML(trainNo)}</h2>
        <div class="tip-box">无法获取该车次的时刻表数据</div>`;
      return;
    }

    const stops = sd.data;
    const toIdx = stops.findIndex(s => s.stationName.includes(toName.replace(/站$/,'')));
    const furtherStops = stops.filter((s, i) => i > toIdx);

    if (!furtherStops.length) {
      c.innerHTML = `<button class="modal-close" onclick="closeModal()">✕</button>
        <h2>🎯 买长乘短 - ${trainNo}</h2>
        <div class="tip-box">该车次 ${toName} 已是终点站，无法买长乘短</div>`;
      return;
    }

    let results = [];
    // 更远站点的余票并发查（原来一个一个等，站点多时要十几秒）
    const stopResults = await mapLimit(furtherStops, CONCURRENT_QUERIES, async (stop) => {
      const stationEntry = Object.values(allStations).find(s => s.name === stop.stationName);
      if (!stationEntry) return null;
      try {
        const tr = await fetch(`/api/ticket?from=${fromCode}&to=${stationEntry.code}&date=${date}`);
        const td = await tr.json();
        if (td.status === 0 && td.data) {
          const sameTrain = td.data.find(t => t.trainNo === trainNo);
          if (sameTrain && hasTicket(sameTrain)) {
            return {
              endStation: stop.stationName,
              endCode: stationEntry.code,
              train: sameTrain,
              stopsAway: furtherStops.indexOf(stop) + 1,
            };
          }
        }
      } catch (e) { /* skip */ }
      return null;
    });
    results = stopResults.filter(Boolean);

    if (results.length) {
      c.innerHTML = `<button class="modal-close" onclick="closeModal()">✕</button>
        <h2>🎯 买长乘短 - ${trainNo}</h2>
        <p style="color:var(--text2);font-size:.85em;margin-bottom:10px">
          找到 <span style="color:var(--success);font-weight:600">${results.length}</span> 个买长乘短方案！
          购买到更远站点的票，在 <span style="color:var(--accent)">${toName}</span> 提前下车。
        </p>
        ${results.map(r => {
          const seats = [
            {n:'商务',v:r.train.business},{n:'一等',v:r.train.first},{n:'二等',v:r.train.second},
            {n:'软卧',v:r.train.softSleep},{n:'硬卧',v:r.train.hardSleep},{n:'硬座',v:r.train.hardSeat},{n:'无座',v:r.train.noSeat},
          ];
          return `<div class="route-card" style="margin-bottom:8px">
            <div class="route-head">
              <div class="route-name">${escapeHTML(fromName)} → ${escapeHTML(r.endStation)}（在${escapeHTML(toName)}下车）</div>
              <div class="route-badge badge-trick">${r.stopsAway}站更远</div>
            </div>
            <div style="display:flex;gap:12px;align-items:center;margin:6px 0">
              <span style="font-family:monospace;font-weight:600">${escapeHTML(r.train.startTime)}</span>
              <span style="color:var(--text2)">→</span>
              <span style="font-family:monospace">${escapeHTML(r.train.arriveTime)}</span>
            </div>
            <div class="seats">
              ${seats.map(s=>{const h=s.v&&s.v!=='无'&&s.v!=='--';return `<span class="seat ${h?'has':'no'}"><span class="stype">${s.n}</span>${s.v||'--'}</span>`;}).join('')}
            </div>
            <div class="tip-box">购买 ${escapeHTML(fromName)}→${escapeHTML(r.endStation)} 的 ${escapeHTML(trainNo)} 次列车，在 ${escapeHTML(toName)} 下车。票价可能略高于直达票。</div>
          </div>`;
        }).join('')}`;
    } else {
      c.innerHTML = `<button class="modal-close" onclick="closeModal()">✕</button>
        <h2>🎯 买长乘短 - ${trainNo}</h2>
        <div class="empty-state"><div class="icon">😕</div>
        <h3>未找到可行方案</h3>
        <p>该车次到更远站点的票也已售完，建议尝试候补或其他车次。</p></div>`;
    }
  } catch (e) {
    c.innerHTML = `<button class="modal-close" onclick="closeModal()">✕</button>
      <h2>🎯 买长乘短</h2>
      <div class="empty-state"><div class="icon">⚠️</div><h3>查询失败</h3><p>${escapeHTML(e.message)}</p></div>`;
  }
}

// ========== 多策略方案 ==========
async function computeStrategies(trains, fromCode, toCode, fromName, toName, date) {
  const strategies = [];
  _transferNotice = '';

  // 1. 直达有票
  const directAvail = trains.filter(t => t.canBuy && hasTicket(t));
  if (directAvail.length) {
    strategies.push({ name:'✅ 直达（有票）', type:'direct', trains:directAvail,
      desc:`找到 ${directAvail.length} 个有票直达车次，可直接在12306购票`, priority:0 });
  }

  // 2. 直达无票（可候补）
  const directWait = trains.filter(t => t.canBuy && !hasTicket(t));
  if (directWait.length) {
    strategies.push({ name:'⏳ 直达（可候补）', type:'waitlist', trains:directWait,
      desc:`${directWait.length} 个车次暂无余票，可在12306提交候补订单`, priority:1 });
  }

  // 3. 买长乘短 - 自动查询（可在界面上关闭）
  try {
    if (wantShortLong()) {
    showProgress('正在查询买长乘短方案...', 70);
    const buyLongResults = await autoBuyLong(trains, fromCode, toCode, date, (cur, total, station) => {
      const pct = 70 + Math.round((cur / total) * 5);
      showProgress(`正在查询买长乘短 ${cur}/${total}${station ? '（' + station + '）' : ''}...`, pct);
    });
    if (buyLongResults.length) {
      strategies.push({ name:'🎯 买长乘短（有票）', type:'buyLong', trains:buyLongResults.map(r=>r.train),
        desc:`找到 ${buyLongResults.length} 个买长乘短方案，买到更远站点在${toName}下车`,
        tip: buyLongResults.slice(0,5).map(r=>`${r.train.trainNo}: 买到${r.endStation}，在${toName}下车`).join('\n'),
        priority:2 });
    }
    }
  } catch (e) { console.error('BuyLong failed:', e); }

  // 4. 中转换乘 - 不同车次换乘（流式进度）
  try {
    showProgress(viaParam() ? '正在查询指定中转站 ' + viaName() + '...' : '正在搜索中转换乘方案...', 80);
    const resp = await fetch(`/api/transfer?from=${fromCode}&to=${toCode}&date=${date}${hubParam()}${viaParam()}${adminParam()}`);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let transferResults = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      // 按行分割 JSON
      const lines = buffer.split('\n');
      buffer = lines.pop(); // 最后一个可能不完整
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const evt = JSON.parse(line);
          if (evt.type === 'progress') {
            const pct = 80 + Math.round((evt.current / evt.total) * 15);
            showProgress(`正在查询中转站 ${evt.hub}（${evt.current}/${evt.total}，已找到${evt.found}个方案）...`, pct);
          } else if (evt.type === 'result') {
            if (evt.status === 0 && evt.data && evt.data.length) {
              transferResults = evt.data;
            } else if (evt.status !== 0 && evt.error) {
              _transferNotice = evt.error;
            }
          }
        } catch (e) { /* ignore parse errors */ }
      }
    }

    if (transferResults.length) {
      var viaOn = !!viaParam();
      if (viaOn && !transferResults.some(function (r) { return r.isSpecified; })) {
        _transferNotice = '指定站本身没有可行的两段方案，下面列出的是它同城其他车站的备选，标题已标出真实换乘站。';
      }
      strategies.push({ name: viaOn ? '🔄 指定中转站换乘' : '🔄 中转换乘（有票）', type:'transfer', trains:[],
        desc: viaOn
          ? `按指定中转站「${viaName()}」查询：${transferResults.length} 个可行站点，两段车次可自由搭配`
          : `找到 ${transferResults.length} 个中转站，可自由搭配前后程`,
        tip: transferResults.map(function (r) {
          var realStops = unionNames(stopNames(r.leg1, 'toStation'), stopNames(r.leg2, 'fromStation'));
          return (r.isSpecified ? '📌 指定站 ' : '') + `经${realStops.length ? realStops.join(' / ') : r.hub}换乘：${r.leg1Count}趟前程 + ${r.leg2Count}趟后程`;
        }).join('\n'),
        transferData: transferResults,
        priority: viaOn ? 1.5 : 2.5 });
    } else if (viaParam() && !_transferNotice) {
      _transferNotice = '指定中转站「' + viaName() + '」及其同城车站，当前没有查到可行的两段方案。可以换个站、到 /admin 放宽检索天数与等待上限，或点「✕ 清除」改回自动找枢纽。';
    }
  } catch (e) { console.error('Transfer failed:', e); }

  // 5. 同车换乘 - 同车分段（同一趟车在中间站拆分购票）
  try {
    showProgress('正在查询同车分段方案...', 85);
    const segResults = await searchSameTrainSegmented(trains, fromCode, toCode, fromName, toName, date, (cur, total, trainNo) => {
      const pct = 85 + Math.round((cur / total) * 5);
      showProgress(`正在查询同车分段 ${cur}/${total}${trainNo ? '（' + trainNo + '）' : ''}...`, pct);
    });
    if (segResults.length) {
      strategies.push({ name:'✂️ 同车换乘（同车）', type:'segmented', trains:[],
        desc:`找到 ${segResults.length} 个同车分段方案，在中间站拆分购票`,
        tip: segResults.slice(0,5).map(r =>
          `${r.trainNo}: 经${r.midStation}分段，两段均有票`
        ).join('\n'),
        segData: segResults,
        priority:3 });
    }
  } catch (e) { console.error('Segmented failed:', e); }

  // 6. 买短乘长 - 实际查询（可在界面上关闭）
  try {
    if (wantShortLong()) {
    showProgress('正在查询买短乘长方案...', 90);
    const buyShortResults = await autoBuyShort(trains, fromCode, toCode, fromName, toName, date, (cur, total, trainNo) => {
      const pct = 90 + Math.round((cur / total) * 5);
      showProgress(`正在查询买短乘长 ${cur}/${total}${trainNo ? '（' + trainNo + '）' : ''}...`, pct);
    });
    if (buyShortResults.length) {
      strategies.push({ name:'📝 买短乘长（有票）', type:'buyShort', trains:buyShortResults.map(r=>r.train),
        desc:`找到 ${buyShortResults.length} 个买短乘长方案，先买短途票上车再补票到${toName}`,
        tip: buyShortResults.slice(0,5).map(r=>`${r.train.trainNo}: 买到${r.endStation}，补票到${toName}`).join('\n'),
        buyShortData: buyShortResults,
        priority:4 });
    }
    }
  } catch (e) { console.error('BuyShort failed:', e); }

  strategies.sort((a,b) => a.priority - b.priority);
  renderStrategies(strategies);
}

// ========== 中转换乘查询 ==========
// 枢纽范围参数：勾选「使用 20 个常见枢纽」时传空，取消勾选则查全部枢纽
function hubParam() {
  var el = document.getElementById('useCommonHubs');
  return (el && !el.checked) ? '&allHubs=1' : '';
}

// ========== 指定中转站 ==========
// 把用户选中的车站代码发给后端：只算「出发地 → 该站 → 目的地」，
// 后端还会自动补上该站同城的其他车站，避免指定站本身没车时算出一片空白。
function viaParam() {
  var el = document.getElementById('viaCode');
  var code = el ? el.value.trim() : '';
  return code ? '&transferStation=' + encodeURIComponent(code) : '';
}
function viaName() {
  var el = document.getElementById('viaInput');
  return el ? el.value.trim() : '';
}
function clearViaStation() {
  var i = document.getElementById('viaInput');
  var c = document.getElementById('viaCode');
  var d = document.getElementById('viaDropdown');
  if (i) i.value = '';
  if (c) c.value = '';
  if (d) d.classList.remove('show');
  updateViaUI();
  if (i) i.focus();
}
function updateViaUI() {
  var codeEl = document.getElementById('viaCode');
  if (!codeEl) return;
  var has = !!codeEl.value.trim();
  var hubChk = document.getElementById('useCommonHubs');
  var hint = document.getElementById('viaHint');
  if (hubChk) {
    hubChk.disabled = has;
    if (hubChk.parentElement) hubChk.parentElement.style.opacity = has ? '.45' : '';
  }
  if (hint) {
    hint.innerHTML = has
      ? '已指定 <b>' + escapeHTML(viaName()) + '</b>：只算经这个站的两段方案，并自动尝试同城其他车站；「常见枢纽」开关暂不生效。'
      : '留空时自动找常见枢纽；填了就以这个站为准，算出「出发地 → 该站 → 目的地」怎么走，并自动尝试同城其他车站。';
  }
}
// 回车直接查询时，用户可能只打了字没点下拉，按文本兜底匹配一次
function syncViaInput() {
  var i = document.getElementById('viaInput');
  var c = document.getElementById('viaCode');
  if (!i || !c) return true;
  var text = i.value.trim();
  if (!text) { c.value = ''; return true; }
  if (c.value.trim()) {
    var byCode = Object.values(allStations).find(function (s) { return s.code === c.value; });
    if (byCode && byCode.name === text) return true;
  }
  var hit = pickStationByText(text);
  if (hit) { i.value = hit.name; c.value = hit.code; updateViaUI(); return true; }
  return false;
}

// 市内出发参数：勾选时把这个城市（地级市）所有车站一起查
// 注意：只用于主列表查询。买长乘短/同车换乘/买短乘长 查的是"特定车次"，
// 若也带上 cityFrom，每次余票查询会扇出到最多 8 个同城站，整体慢 8 倍且极易被限流。

function cityParam() {
  var el = document.getElementById('useCityFrom');
  return (el && el.checked) ? '&cityFrom=1' : '';
}

// 管理页（/admin）保存的检索参数：第二段天数 / 换乘等待上限
function adminParam() {
  try {
    var raw = localStorage.getItem('piaolu_admin');

// 是否计算买长乘短 / 买短乘长
function wantShortLong() {

}

async function searchTransfer(fromCode, toCode, date) {
  try {
    const resp = await fetch(`/api/transfer?from=${fromCode}&to=${toCode}&date=${date}${hubParam()}${viaParam()}`);
    const data = await resp.json();
    if (data.status === 0 && data.data) {
      return data.data;
    }
  } catch (e) {
    console.error('Transfer search failed:', e);
  }
  return [];
}

async function autoBuyLong(trains, fromCode, toCode, date, onProgress) {
  const results = [];
  const toName = document.getElementById('toInput').value;
  const checkTrains = trains.filter(t => t.canBuy).slice(0, 10);
  const checkedPairs = new Set();
  let done = 0;

  // 每趟车一个并发任务（原来逐趟串行）
  await mapLimit(checkTrains, CONCURRENT_QUERIES, async (t) => {
    try {
      const sr = await fetch(`/api/schedule?trainNo=${t.trainCode}&date=${date}&fromCode=${fromCode}&toCode=${t.toStationCode}`);
      const sd = await sr.json();
      if (sd.status === 0 && sd.data) {
        const stops = sd.data;
        const toIdx = stops.findIndex(s => s.stationName.includes(toName.replace(/站$/, '')));
        if (toIdx >= 0) {
          const furtherStops = stops.slice(toIdx + 1).slice(0, 4);
          // 从近到远试最多 4 个更远站，找到第一个有票的即可
          for (const stop of furtherStops) {
            const endStation = Object.values(allStations).find(s => s.name === stop.stationName);
            if (!endStation) continue;
            const pairKey = fromCode + '_' + endStation.code;
            if (checkedPairs.has(pairKey)) continue;
            checkedPairs.add(pairKey);

            try {
              const tr = await fetch(`/api/ticket?from=${fromCode}&to=${endStation.code}&date=${date}`);
              const td = await tr.json();
              if (td.status !== 0 || !td.data) continue;

              const sameTrain = td.data.find(x => x.trainNo === t.trainNo);
              if (sameTrain && hasTicket(sameTrain)) {
                results.push({ train: sameTrain, endStation: stop.stationName });
                break; // 找到一个即可，跳出内层循环
              }
            } catch (e) { /* skip */ }
          }
        }
      }
    } catch (e) { /* skip */ }

    done++;
    if (onProgress) onProgress(done, checkTrains.length, t.trainNo);
  });

  return results;
}

// 构建同车分段的单段车次行
function buildSameTrainSegRow(train, trainNo) {
  var seats = seatTagsHTML(train);
  var price = getMinAvailablePrice(train);

  var isReal = train.prices && Object.keys(train.prices).length > 0;

  var hasAnyTicket = train.canBuy && hasTicket(train);
  var cls = 'leg-row' + (hasAnyTicket ? '' : ' no-ticket');
  var row = '<div class="'+cls+'" style="background:var(--card);border-radius:6px;border:1px solid var(--border)">';
  row += '<span class="lr-no">' + escapeHTML(train.trainNo) + '</span>';
  row += '<span class="lr-time">' + escapeHTML(train.startTime) + '</span>';
  row += '<span style="color:var(--text3)">→</span>';
  row += '<span class="lr-time">' + escapeHTML(train.arriveTime) + '</span>';
  row += '<span class="lr-seats">' + seats + '</span>';
  row += '<span class="lr-price price-tip" style="color:var(--accent);font-weight:600;cursor:help">' + pfx + price + '<span class="tip-content">' + tip + '</span></span>';
  row += '</div>';
  return row;
}

async function searchSegmented(fromCode, toCode, fromName, toName, date) {
