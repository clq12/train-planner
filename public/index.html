// ========== 同车换乘查询（同车分段） ==========
async function searchSameTrainSegmented(trains, fromCode, toCode, fromName, toName, date, onProgress) {
  const results = [];
  const seenTrains = new Set();
  // 筛选有票或可候补的车次
  const checkTrains = trains.filter(t => t.canBuy).slice(0, 10);
  let done = 0;

  await mapLimit(checkTrains, CONCURRENT_QUERIES, async (t) => {
    try {
      if (!seenTrains.has(t.trainNo)) {
        const sr = await fetch(`/api/schedule?trainNo=${t.trainCode}&date=${date}&fromCode=${fromCode}&toCode=${t.toStationCode}`);
        const sd = await sr.json();
        if (sd.status === 0 && sd.data) {
          const stops = sd.data;
          const fromIdx = stops.findIndex(s => s.stationName.includes(fromName.replace(/站$/, '')));
          const toIdx = stops.findIndex(s => s.stationName.includes(toName.replace(/站$/, '')));
          if (fromIdx >= 0 && toIdx > fromIdx) {
            // 遍历中间站（从远到近）找同车分段方案。
            // 每站要查 2 次余票，站多时请求量翻倍，只从目的地往前试 4 个站
            const MAX_MID_TRY = 4;
            const midStops = stops.slice(fromIdx + 1, toIdx);
            let tried = 0;
            for (let mi = midStops.length - 1; mi >= 0 && tried < MAX_MID_TRY; mi--) {
              tried++;
              const mid = midStops[mi];
              const midStation = Object.values(allStations).find(s => s.name === mid.stationName);
              if (!midStation) continue;

              try {
                // 两段余票并发查（原来是一段等完再查下一段，白白多等一个来回）
                const [d1, d2] = await Promise.all([
                  fetch(`/api/ticket?from=${fromCode}&to=${midStation.code}&date=${date}`).then(r => r.json()),
                  fetch(`/api/ticket?from=${midStation.code}&to=${toCode}&date=${date}`).then(r => r.json()),
                ]);
                if (d1.status !== 0 || !d1.data) continue;
                const leg1Train = d1.data.find(x => x.trainNo === t.trainNo);
                if (!leg1Train || !hasTicket(leg1Train)) continue;

                if (d2.status !== 0 || !d2.data) continue;
                const leg2Train = d2.data.find(x => x.trainNo === t.trainNo);
                if (!leg2Train || !hasTicket(leg2Train)) continue;

                // 两段都有票，记录方案
                results.push({
                  midStation: mid.stationName,
                  midCode: midStation.code,
                  trainNo: t.trainNo,
                  trainCode: t.trainCode,
                  leg1: leg1Train,
                  leg2: leg2Train,
                });
                seenTrains.add(t.trainNo);
                break; // 每趟车只取一个最优分段点
              } catch (e) { /* skip */ }
            }
          }
        }
      }
    } catch (e) { /* skip */ }

    done++;
    if (onProgress) onProgress(done, checkTrains.length, t.trainNo);
  });

  return results;
}

// ========== 买短乘长自动查询 ==========
async function autoBuyShort(trains, fromCode, toCode, fromName, toName, date, onProgress) {
  const results = [];
  const seenTrains = new Set();
  const checkTrains = trains.filter(t => t.canBuy).slice(0, 8);
  let done = 0;

  // 每趟车一个并发任务（原来逐趟串行，等于把网络等待一个个排起来）
  await mapLimit(checkTrains, CONCURRENT_QUERIES, async (t) => {
    try {
      const sr = await fetch(`/api/schedule?trainNo=${t.trainCode}&date=${date}&fromCode=${fromCode}&toCode=${t.toStationCode}`);
      const sd = await sr.json();
      if (sd.status === 0 && sd.data) {
        const stops = sd.data;
        const fromIdx = stops.findIndex(s => s.stationName.includes(fromName.replace(/站$/, '')));
        const toIdx = stops.findIndex(s => s.stationName.includes(toName.replace(/站$/, '')));
        if (fromIdx >= 0 && toIdx > fromIdx) {
          // 尝试多个中间站（从近到远）
          const midStops = stops.slice(fromIdx + 1, toIdx);
          let bsTried = 0;
          for (let mi = midStops.length - 1; mi >= 0 && results.length < 5 && bsTried < 4; mi--) {
            bsTried++;
            const targetMid = midStops[mi];
            const midStation = Object.values(allStations).find(s => s.name === targetMid.stationName);
            if (!midStation || seenTrains.has(t.trainNo)) continue;

            const tr = await fetch(`/api/ticket?from=${fromCode}&to=${midStation.code}&date=${date}`);
            const td = await tr.json();
            if (td.status !== 0 || !td.data) continue;

            const sameTrain = td.data.find(x => x.trainNo === t.trainNo);
            if (sameTrain && hasTicket(sameTrain)) {
              results.push({ train: sameTrain, endStation: targetMid.stationName, midCode: midStation.code });
              seenTrains.add(t.trainNo);
              break; // 每个车次只取一个最优方案
            }
          }
        }
      }
    } catch (e) { /* skip */ }

    done++;
    if (onProgress) onProgress(done, checkTrains.length, t.trainNo);
  });

  return results;
}

// ========== 每个策略卡片的排序/筛选状态 ==========
const stratState = {};

function initStratState(idx) {
  if (!stratState[idx]) {
    stratState[idx] = { sort: 'time', asc: true, depStart: '', depEnd: '', arrStart: '', arrEnd: '' };
  }
}

function setStratSort(idx, key) {
  initStratState(idx);
  const s = stratState[idx];
  if (s.sort === key) { s.asc = !s.asc; } else { s.sort = key; s.asc = true; }
  renderStrategyCard(idx);
}

function setStratFilter(idx, field, val) {
  initStratState(idx);
  stratState[idx][field] = val;
  renderStrategyCard(idx);
}

function clearStratFilter(idx, field) {
  initStratState(idx);
  stratState[idx][field] = '';
  renderStrategyCard(idx);
}

function clearAllStratFilters(idx) {
  stratState[idx] = { sort: 'time', asc: true, depStart: '', depEnd: '', arrStart: '', arrEnd: '' };
  renderStrategyCard(idx);
}

function sortFilterTrains(trains, st) {
  let list = [...trains];
  const depS = st.depStart ? timeToMinutes(st.depStart) : -1;
  const depE = st.depEnd ? timeToMinutes(st.depEnd) : -1;
  const arrS = st.arrStart ? timeToMinutes(st.arrStart) : -1;
  const arrE = st.arrEnd ? timeToMinutes(st.arrEnd) : -1;

  if (depS >= 0 || depE >= 0) {
    const s = depS >= 0 ? depS : 0;
    const e = depE >= 0 ? depE : 1440;
    if (s <= e) list = list.filter(t => { const m = timeToMinutes(t.startTime); return m >= s && m <= e; });
    else list = list.filter(t => { const m = timeToMinutes(t.startTime); return m >= s || m <= e; });
  }
  if (arrS >= 0 || arrE >= 0) {
    const s = arrS >= 0 ? arrS : 0;
    const e = arrE >= 0 ? arrE : 1440;
    if (s <= e) list = list.filter(t => { const m = timeToMinutes(t.arriveTime); return m >= s && m <= e; });
    else list = list.filter(t => { const m = timeToMinutes(t.arriveTime); return m >= s || m <= e; });
  }

  list.sort((a, b) => {
    let cmp = 0;
    switch (st.sort) {
      case 'time': cmp = timeToMinutes(a.startTime) - timeToMinutes(b.startTime); break;
      case 'arrive': cmp = timeToMinutes(a.arriveTime) - timeToMinutes(b.arriveTime); break;
      case 'duration':
        const da = (a.duration||'99:99').split(':'), db = (b.duration||'99:99').split(':');
        cmp = (parseInt(da[0])*60+parseInt(da[1])) - (parseInt(db[0])*60+parseInt(db[1]));
        break;
      case 'price': cmp = estimatePrice(a) - estimatePrice(b); break;
    }
    return st.asc ? cmp : -cmp;
  });
  return list;
}

// ===== 方案级排序/筛选（中转换乘、同车换乘共用） =====
// 原因：sortFilterTrains 只处理 s.trains，transferData / segData 原先直接按原始顺序渲染，
// 所以这两类卡片的排序按钮点了等于没点。
function stratTrainValue(t, key) {
  if (!t) return Infinity;
  switch (key) {
    case 'time': return timeToMinutes(t.startTime || '99:99');
    case 'arrive': return timeToMinutes(t.arriveTime || '99:99');
    case 'duration': {
      var p = (t.duration || '99:99').split(':');
      return (parseInt(p[0]) || 0) * 60 + (parseInt(p[1]) || 0);
    }
    case 'price': return getMinAvailablePrice(t);
    default: return 0;
  }
}

function stratMinPrice(list) {
  var m = Infinity;
  for (var i = 0; i < (list || []).length; i++) {
    var p = getMinAvailablePrice(list[i]);
    if (p < m) m = p;
  }
  return m === Infinity ? 0 : m;
}

function stratInRange(m, startStr, endStr) {
  var s = startStr ? timeToMinutes(startStr) : 0;
  var e = endStr ? timeToMinutes(endStr) : 1440;
  return s <= e ? (m >= s && m <= e) : (m >= s || m <= e);
}

function stratTrainFits(t, st) {
  if (!t) return false;
  if (st.depStart || st.depEnd) {
    if (!stratInRange(timeToMinutes(t.startTime || '00:00'), st.depStart, st.depEnd)) return false;
  }
  if (st.arrStart || st.arrEnd) {
    if (!stratInRange(timeToMinutes(t.arriveTime || '00:00'), st.arrStart, st.arrEnd)) return false;
  }
  return true;
}

function stratHasTimeFilter(st) {
  return !!(st.depStart || st.depEnd || st.arrStart || st.arrEnd);
}

var _hubBest = {};   // hubId -> { price/duration/arrive: { pair:[leg1索引, leg2索引], value } }

// 点击「价格最低 / 时间最短 / 到达最快」：直接选中这组车次并滚动到汇总条
function applyHubBest(hubId, kind) {
  var info = _hubBest[hubId];
  if (!info || !info[kind] || !info[kind].pair) return;
  var pair = info[kind].pair;

  var parts = hubId.split('_');
  var s = _currentStrategies[parseInt(parts[1], 10)];
  var r = s && s.transferData ? s.transferData[parseInt(parts[2], 10)] : null;
  if (!r) return;

  // 选中的组合若含无票车次，先切到"全部"模式，否则行是隐藏的看不到
  var t1 = r.leg1[pair[0]], t2 = r.leg2[pair[1]];
  var bothTicketed = t1 && t2 && t1.canBuy && hasTicket(t1) && t2.canBuy && hasTicket(t2);
  if (!bothTicketed && !_hubShowAll[hubId]) {
    toggleHubTickets(hubId);
  }

  _dualPanelState[hubId] = { leg1: pair[0], leg2: pair[1] };
  refreshDualPanel(hubId);

  ['price', 'duration', 'arrive'].forEach(function (k) {
    var b = document.getElementById(hubId + '_badge_' + k);
    if (b) b.classList.toggle('active', k === kind);
  });

  var sum = document.getElementById(hubId + '_summary');
  if (sum && sum.scrollIntoView) {
    try { sum.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { sum.scrollIntoView(); }
  }
}

// 计算某个枢纽块里"能接上的最优组合"的三项指标（用于打「价格最低/时间最短/到达最快」标签）
// 返回 { price: 总价最低, duration: 全程最短, arrive: 到达最早 }（绝对分钟）
// ========== 换乘真实站点 ==========
// 12306 的 queryG 会做「同城扩展」：查「成都东」可能返回终到「成都龙泉驿」、
// 或从「成都西」发车的车次；查「黄龙九寨」也可能返回终到「松潘」的车次。
// 所以列标题、枢纽名都必须取每趟车返回的真实站名，不能用第一趟车代表整列。
function stopNames(list, field) {
  var seen = {}, out = [];
  for (var i = 0; i < (list || []).length; i++) {
    var n = list[i] && list[i][field];
    if (n && !seen[n]) { seen[n] = true; out.push(n); }
  }
  return out;
}
function stopLabel(names, max) {
  max = max || 3;
  if (!names || !names.length) return '';
  if (names.length <= max) return names.join(' / ');
  return names.slice(0, max).join(' / ') + ' 等 ' + names.length + ' 站';
}
function unionNames(a, b) {
  var out = [];
  (a || []).concat(b || []).forEach(function (n) { if (n && out.indexOf(n) < 0) out.push(n); });
  return out;
}
function crossStation(t1, t2) {
  return !!(t1 && t2 && t1.toStation && t2.fromStation && t1.toStation !== t2.fromStation);
}
// 每块方案里「多数车次」停靠的站，作为该列的基准；与基准不同的车次高亮提示
var _hubBaselines = {};
function modeName(list, field) {
  var cnt = {}, best = '', bestN = 0;
  (list || []).forEach(function (t) {
    var n = t && t[field];
    if (!n) return;
    cnt[n] = (cnt[n] || 0) + 1;
    if (cnt[n] > bestN) { bestN = cnt[n]; best = n; }
  });
  return best;
}
function hubBaselines(hubId, hubData) {
  _hubBaselines[hubId] = {
    arr: modeName(hubData.leg1, 'toStation'),
    dep: modeName(hubData.leg2, 'fromStation'),
  };
}

function hubBestMetrics(r, ticketedOnly) {
  var best = {
    price: Infinity, duration: Infinity, arrive: Infinity,
    pricePair: null, durationPair: null, arrivePair: null,
  };
  if (!r || !r.leg1 || !r.leg2 || !r.compatibility) return best;
  for (var i = 0; i < r.leg1.length; i++) {
    var t1 = r.leg1[i];
    var compat = r.compatibility[i] || [];
    if (!compat.length) continue;
    if (ticketedOnly && !(t1.canBuy && hasTicket(t1))) continue;
    var p1 = getMinAvailablePrice(t1);
    var start1 = timeToMinutes(t1.startTime);
    var arr1Abs = start1 + durToMinutes(t1.duration);
    for (var k = 0; k < compat.length; k++) {
      var t2 = r.leg2[compat[k]];
      if (!t2) continue;
      if (ticketedOnly && !(t2.canBuy && hasTicket(t2))) continue;
      var dep2Abs = (t2.dayOffset || 0) * 1440 + timeToMinutes(t2.startTime);
      if (dep2Abs < arr1Abs + 20) continue;            // 兜底：确实接得上
      var arriveAbs = dep2Abs + durToMinutes(t2.duration);
      var total = arriveAbs - start1;                  // 全程耗时（含换乘等待）
      if (total < best.duration) { best.duration = total; best.durationPair = [i, compat[k]]; }
      if (arriveAbs < best.arrive) { best.arrive = arriveAbs; best.arrivePair = [i, compat[k]]; }
      // 票价缺失时 getMinAvailablePrice 可能返回 0，不能拿它比价格，否则会被误标"价格最低"
      var p2 = getMinAvailablePrice(t2);
      if (p1 > 0 && p2 > 0 && p1 + p2 < best.price) { best.price = p1 + p2; best.pricePair = [i, compat[k]]; }
    }
  }
  return best;
}

// 中转换乘：一个枢纽一块，用"这块里最好的一趟第一段"代表整块排序
function stratPlanTransfer(list, st) {
  var items = [];
  for (var i = 0; i < list.length; i++) {
    var leg1 = list[i].leg1 || [];
    var leg2 = list[i].leg2 || [];
    var usable1 = leg1.filter(function (t) { return t.canBuy && hasTicket(t); });
    var pool = usable1.length ? usable1 : leg1;
    if (!pool.length) continue;
    if (stratHasTimeFilter(st) && !pool.some(function (t) { return stratTrainFits(t, st); })) continue;

    var key;
    if (st.sort === 'price') {
      var usable2 = leg2.filter(function (t) { return t.canBuy && hasTicket(t); });
      key = stratMinPrice(pool) + stratMinPrice(usable2.length ? usable2 : leg2);
    } else {
      key = Infinity;
      for (var j = 0; j < pool.length; j++) {
        var v = stratTrainValue(pool[j], st.sort);
        if (v < key) key = v;
      }
    }
    items.push({ data: list[i], orig: i, key: key });
  }
  items.sort(function (a, b) { return st.asc ? a.key - b.key : b.key - a.key; });
  return items;
}

// 同车换乘：一条方案就是一趟车，按第一段的时刻排序
function stratPlanSegments(list, st) {
  var items = [];
  for (var i = 0; i < list.length; i++) {
    var t = list[i].leg1 || {};
    if (stratHasTimeFilter(st) && !stratTrainFits(t, st)) continue;
    var key = st.sort === 'price'
      ? getMinAvailablePrice(t) + getMinAvailablePrice(list[i].leg2 || {})
      : stratTrainValue(t, st.sort);
    items.push({ data: list[i], orig: i, key: key });
  }
  items.sort(function (a, b) { return st.asc ? a.key - b.key : b.key - a.key; });
  return items;
}

function stratSortBtns(idx, keys, labels, curSort, curAsc) {

    '<button class="sort-btn '+(curSort===k?'active':'')+'" onclick="setStratSort('+idx+',\''+k+'\')">'+labels[k]+' '+(curSort===k?(curAsc?'↑':'↓'):'↑')+'</button>'
  ).join('');
}

function buildStrategyContent(idx, s) {
  initStratState(idx);

        + ' <span style="color:var(--success);font-weight:600">'+seatStr+'</span>'

    if (filtered.length === 0) content += '<span style="color:var(--text3);font-size:.82em">无符合条件的车次</span>';
    content += '</div>';
  }

  // transfer - 使用共享的左右双列面板组件（按当前排序/筛选处理枢纽块）
  if (s.transferData && s.transferData.length) {
    var hubPlan = stratPlanTransfer(s.transferData, st);
    // 先算出每个枢纽的最优指标，找出全局最优再打标签
    // 优先只统计"两段都有票"的组合；若整个枢纽都没票，再退回全部车次
    var hubMetrics = hubPlan.map(function (x) {
      var m = hubBestMetrics(x.data, true);
      if (!isFinite(m.price) && !isFinite(m.duration) && !isFinite(m.arrive)) {
        m = hubBestMetrics(x.data, false);
      }
      return m;
    });
    var bestP = Infinity, bestD = Infinity, bestA = Infinity;
    hubMetrics.forEach(function (m) {

      if (m.duration < bestD) bestD = m.duration;
      if (m.arrive < bestA) bestA = m.arrive;

      content += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px">';
      var hubBadges = '';

      var hm = hubMetrics[ri] || {};
      // 记下每个标签对应的车次组合，点击时直接选中
      _hubBest[hubId] = {
        price: { pair: hm.pricePair, value: hm.price },
        duration: { pair: hm.durationPair, value: hm.duration },
        arrive: { pair: hm.arrivePair, value: hm.arrive },
      };
      if (isFinite(bestP) && hm.price === bestP) {
        hubBadges += '<button id="'+hubId+'_badge_price" class="hub-badge badge-price" onclick="applyHubBest(\''+hubId+'\',\'price\')" title="点击选中这组车次（只统计两段都能衔接、且都有票的组合）">价格最低</button>';
      }
      if (isFinite(bestD) && hm.duration === bestD) {
        hubBadges += '<button id="'+hubId+'_badge_duration" class="hub-badge badge-time" onclick="applyHubBest(\''+hubId+'\',\'duration\')" title="点击选中这组车次（只统计两段都能衔接、且都有票的组合）">时间最短</button>';

      }
      // 真实站点：第一段实际到达站 + 第二段实际出发站，才是这块方案真正的换乘站

      content += '<button class="hub-ticket-toggle" id="'+hubId+'_toggle" onclick="toggleHubTickets(\''+hubId+'\')">有票</button>';

  // segmented - 同车换乘

      }
      content += '</div>';
      content += '<div style="margin-top:4px;font-size:.75em;color:var(--text2)">⚠️ 到站后需补票至目的地，可能无座</div>';
      content += '</div>';
    }
    content += '</div>';
  }

  if (s.tip) {
    content += '<div class="tip-box" style="margin-top:8px">'+s.tip.replace(/\n/g,'<br>')+'</div>';
  }

  return content;
}

// ========== 共享组件：左右双列面板（中转换乘 & 同车换乘复用） ==========

// 全局状态：每个 hubId 对应的选中 leg1/leg2 索引
var _dualPanelState = {}; // { hubId: { leg1: displayIdx, leg2: displayIdx } }
var _dualPanelOrigIdx = {}; // { hubId: [origIdx, ...] } 排序后的原始索引映射

// 构建单趟车次行（leg1 或 leg2）
function buildLegRow(t, hubId, leg, idx, options) {
  options = options || {};
  var seats = seatTagsHTML(t);
  var price = getMinAvailablePrice(t);
  var tip = priceTooltipHTML(t);
  var isReal = t.prices && Object.keys(t.prices).length > 0;
  var pfx = isReal ? '¥' : '≈¥';
  var panelState = _dualPanelState[hubId] || {};
  var isSelected = panelState[leg] === idx;
  var hasAnyTicket = t.canBuy && hasTicket(t);
  var bg = isSelected ? 'background:rgba(13,148,136,.12);border-left:3px solid var(--accent)' : 'border-left:3px solid transparent';
  var cls = 'leg-row' + (hasAnyTicket ? '' : ' no-ticket');
  var onClick = ' onclick="selectDualPanel(\''+hubId+'\',\''+leg+'\','+idx+')"';

  // 逐行显示这趟车真正的起终点：不能让整列共用一个枢纽名
  var _staText = (t.fromStation || '?') + ' → ' + (t.toStation || '?');
  var _base = _hubBaselines[hubId] || {};
  var _staDiff = leg === 'leg1'
    ? !!(t.toStation && _base.arr && t.toStation !== _base.arr)
    : !!(t.fromStation && _base.dep && t.fromStation !== _base.dep);
  var row = '<div'+onClick+' class="'+cls+'" style="'+bg+'" title="'+escapeHTML(_staText)+'">';
  row += '<span class="lr-no">'+escapeHTML(t.trainNo)+'</span>';
  if (options.noConnect) {
    row += '<span class="lr-noconn" title="这趟车到达后接不上任何一趟第二段">无衔接</span>';
  }
  // 发车日偏移：第二段可能隔一两天才发车（相对整个行程的出发日）
  var _depDay = (leg === 'leg2' ? (t.dayOffset || 0) : 0);
  if (_depDay > 0) {
    var dayTip = _depDay === 1 ? '次日发车' : ('第 ' + (_depDay + 1) + ' 天发车');
    row += '<span class="lr-day" title="'+dayTip+'">+'+_depDay+'</span>';
  }
  row += '<span class="lr-time">'+escapeHTML(t.startTime)+'</span>';
  row += '<span style="color:var(--text3)">→</span>';
  row += '<span class="lr-time">'+escapeHTML(t.arriveTime)+'</span>';
  // 到达日徽标是「相对整个行程出发日」的绝对天数 = 发车日偏移 + 本段车程跨夜天数。
  // 例：+1 天 15:05 发车、隔夜 00:25 到，实际是第 3 天到，应显示 +2 而不是再写一个 +1。
  var _depMins = timeToMinutes(t.startTime);
  var _durMins = durToMinutes(t.duration);
  var _arrShift = _durMins > 0
    ? Math.floor((_depMins + _durMins) / 1440)
    : (timeToMinutes(t.arriveTime) < _depMins ? 1 : 0);
  var _arrDay = _depDay + _arrShift;
  if (_arrShift > 0) {
    var _arrDayTip = '第 ' + (_arrDay + 1) + ' 天到达（相对出发日；本段车程跨 ' + _arrShift + ' 天）';
    row += '<span class="lr-day" title="'+_arrDayTip+'">+'+_arrDay+'</span>';
  }
  row += '<span class="lr-seats">'+seats+'</span>';
  row += '<span class="lr-price price-tip" style="color:var(--accent);font-weight:600;cursor:help">'+pfx+price+'<span class="tip-content">'+tip+'</span></span>';
  row += '<span class="lr-sta'+(_staDiff ? ' lr-sta-diff' : '')+'">'+(_staDiff ? '⚠ ' : '')+escapeHTML(_staText)+'</span>';
  row += '</div>';
  return row;
}

// 构建左右双列面板 HTML
// hubData: { hub, hubCode, leg1, leg2, compatibility, leg1Count, leg2Count }
// options: { hubId, leg1Label, leg2Label, note }
function buildDualLegPanel(hubData, options) {
  var hubId = options.hubId;
  hubBaselines(hubId, hubData);
  var leg1Label = options.leg1Label || '第一段（出发）';
  var leg2Label = options.leg2Label || '第二段（到达）';
  var note = options.note || '';

  var content = '';
  content += '<div class="dual-panel">';
  // 左列：第一段
  content += '<div class="dual-panel-leg">';
  content += '<div style="font-size:.78em;color:var(--text2);margin-bottom:4px;font-weight:600">'+leg1Label+'</div>';
  content += '<div id="'+hubId+'_leg1" style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;background:var(--card)">';
  for (var i = 0; i < hubData.leg1.length; i++) {
    var compatCount = (hubData.compatibility && hubData.compatibility[i] || []).length;
    content += buildLegRow(hubData.leg1[i], hubId, 'leg1', i, { noConnect: compatCount === 0 });
  }
  content += '</div></div>';
  // 右列：第二段
  content += '<div class="dual-panel-leg">';
  content += '<div style="font-size:.78em;color:var(--text2);margin-bottom:4px;font-weight:600">'+leg2Label+'<span id="'+hubId+'_filter_hint" style="margin-left:6px;color:var(--accent);font-size:.9em"></span></div>';
  content += '<div id="'+hubId+'_leg2" style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;background:var(--card)">';
  for (var j = 0; j < hubData.leg2.length; j++) {
    content += buildLegRow(hubData.leg2[j], hubId, 'leg2', j);
  }
  content += '</div></div>';
  content += '</div>';
  // 汇总条：选中后显示总时间和总花费
  content += '<div id="'+hubId+'_summary" style="margin-top:8px;display:none;padding:8px 12px;background:rgba(13,148,136,.06);border:1px solid rgba(13,148,136,.15);border-radius:8px;font-size:.82em"></div>';
  if (note) {
    content += '<div style="margin-top:6px;font-size:.75em;color:var(--text2)">'+note+'</div>';
  }
  return content;
}

// 构建排序后的左右双列面板（同车换乘专用）
// sortedLeg1: 排序后的 leg1 数组
// sortedOrigIndices: 排序后每个位置对应的原始索引（用于 compatibility 查询）

  content += '<div id="'+hubId+'_leg1" style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;background:var(--card)">';

// 切换中转面板显示模式：有票 / 全部
var _hubShowAll = {}; // { hubId: true/false }
function toggleHubTickets(hubId) {
  _hubShowAll[hubId] = !_hubShowAll[hubId];
  var container = document.getElementById(hubId + '_leg1');
  var container2 = document.getElementById(hubId + '_leg2');
  var btn = document.getElementById(hubId + '_toggle');
  if (_hubShowAll[hubId]) {
    if (container) container.classList.add('show-all');
    if (container2) container2.classList.add('show-all');
    if (btn) { btn.textContent = '全部'; btn.classList.add('active'); }
  } else {
    if (container) container.classList.remove('show-all');
    if (container2) container2.classList.remove('show-all');
    if (btn) { btn.textContent = '有票'; btn.classList.remove('active'); }
  }
  // 刷新兼容性筛选提示
  refreshDualPanel(hubId);
}

// 点击 leg1 行：选中/取消，刷新 leg2 筛选
// 点击车次行（leg1 或 leg2）：选中/取消，刷新面板
function selectDualPanel(hubId, leg, idx) {
  if (!_dualPanelState[hubId]) _dualPanelState[hubId] = {};
  if (_dualPanelState[hubId][leg] === idx) {
    delete _dualPanelState[hubId][leg];
  } else {
    _dualPanelState[hubId][leg] = idx;
    // 切换 leg1 时清除 leg2 选中（因为兼容集变了）
    if (leg === 'leg1') {
      delete _dualPanelState[hubId]['leg2'];
    }
  }
  refreshDualPanel(hubId);
}

// 刷新整个面板（左右两列选中态 + 右列筛选 + 汇总条）
function refreshDualPanel(hubId) {
  var parts = hubId.split('_');
  var stratIdx = parseInt(parts[1]);
  var hubIdx = parseInt(parts[2]);
  var s = _currentStrategies[stratIdx];
  if (!s) return;
  var r = s.transferData ? s.transferData[hubIdx] : (s.segData ? s.segData[hubIdx] : null);
  if (!r) return;

  var state = _dualPanelState[hubId] || {};
  var selectedLeg1Display = state.leg1;
  var selectedLeg2Display = state.leg2;

  // 将显示索引转换为原始索引
  var selectedLeg1Orig = selectedLeg1Display;
  if (_dualPanelOrigIdx[hubId] && selectedLeg1Display !== undefined) {
    selectedLeg1Orig = _dualPanelOrigIdx[hubId][selectedLeg1Display];
  }

  // 刷新左列选中态
  var leg1Container = document.getElementById(hubId + '_leg1');
  if (leg1Container) {
    var rows1 = leg1Container.children;
    for (var i = 0; i < rows1.length; i++) {
      var t1 = r.leg1[i];
      var hasAnyTicket1 = t1 && t1.canBuy && hasTicket(t1);
      if (i === selectedLeg1Display) {
        rows1[i].style.background = 'rgba(13,148,136,.12)';
        rows1[i].style.borderLeft = '3px solid var(--accent)';
      } else {
        rows1[i].style.background = '';
        rows1[i].style.borderLeft = '3px solid transparent';
      }
    }
    // 保持 show-all 状态
    if (_hubShowAll[hubId]) leg1Container.classList.add('show-all');
  }

  // 刷新右列（筛选 + 选中态）
  var leg2Container = document.getElementById(hubId + '_leg2');
  var hintEl = document.getElementById(hubId + '_filter_hint');
  if (leg2Container) {
    var html = '';
    var compatLeg2Indices = [];
    if (selectedLeg1Orig !== undefined && r.compatibility && r.compatibility[selectedLeg1Orig]) {
      var compat = r.compatibility[selectedLeg1Orig];
      var compatSet = {};
      for (var c = 0; c < compat.length; c++) compatSet[compat[c]] = true;
      for (var j = 0; j < r.leg2.length; j++) {
        if (compatSet[j]) {
          html += buildLegRow(r.leg2[j], hubId, 'leg2', j);
          compatLeg2Indices.push(j);
        }
      }
      var compatWithTicket = compat.filter(function(j){ return r.leg2[j] && r.leg2[j].canBuy && hasTicket(r.leg2[j]); }).length;
      var compatNoTicket = compat.length - compatWithTicket;
      if (hintEl) {
        if (compatNoTicket > 0) {
          hintEl.textContent = '✓ ' + compatWithTicket + '有票/' + compatNoTicket + '无票';
        } else {
          hintEl.textContent = '✓ ' + compat.length + '趟有票';
        }
      }
    } else {
      for (var j2 = 0; j2 < r.leg2.length; j2++) {
        html += buildLegRow(r.leg2[j2], hubId, 'leg2', j2);
      }
      if (hintEl) hintEl.textContent = '';
    }
    leg2Container.innerHTML = html;
    // 保持 show-all 状态
    if (_hubShowAll[hubId]) leg2Container.classList.add('show-all');
  }

  // 更新汇总条：左右各选一个时显示精确结果
  var summaryEl = document.getElementById(hubId + '_summary');
  if (summaryEl) {
    var t1 = selectedLeg1Orig !== undefined ? r.leg1[selectedLeg1Orig] : null;
    var t2 = selectedLeg2Display !== undefined ? r.leg2[selectedLeg2Display] : null;
    if (t1 && t2) {
      var p1 = getMinAvailablePrice(t1);
      var p2 = getMinAvailablePrice(t2);
      var totalPrice = p1 + p2;
      var hasReal = (t1.prices && Object.keys(t1.prices).length > 0) || (t2.prices && Object.keys(t2.prices).length > 0);
      var pricePfx = hasReal ? '¥' : '≈¥';
      // 总时间：leg1耗时 + 换乘间隔 + leg2耗时
      // 用"绝对分钟"算，跨日才不会被算成负数（第一段可能跨夜，第二段可能是 +1/+2 天）
      var leg1Dur = durToMinutes(t1.duration);
      var leg2Dur = durToMinutes(t2.duration);
      var arr1Abs = timeToMinutes(t1.startTime) + leg1Dur;
      var dep2Abs = (t2.dayOffset || 0) * 1440 + timeToMinutes(t2.startTime);
      var gap = dep2Abs - arr1Abs;
      if (gap < 0) gap += 1440;
      var totalDur = leg1Dur + gap + leg2Dur;
      // 到达日（相对整个行程出发日）= 第二段发车日偏移 + 第二段车程跨夜天数
      var _d2Dep = timeToMinutes(t2.startTime);
      var _d2Shift = leg2Dur > 0
        ? Math.floor((_d2Dep + leg2Dur) / 1440)
        : (timeToMinutes(t2.arriveTime) < _d2Dep ? 1 : 0);
      var _arrDayAbs = (t2.dayOffset || 0) + _d2Shift;
      var arriveDayText = _arrDayAbs > 0
        ? ' · <span title="相对出发日">第 ' + (_arrDayAbs + 1) + ' 天到</span>'
        : '';
      // 换乘间隔显示：跨站换乘要额外预留市内交通时间
      var isCross = crossStation(t1, t2);
      var minGap = isCross ? 90 : 20;
      var gapColor = gap < minGap ? 'var(--error)' : (gap < 60 ? 'var(--warn)' : 'var(--success)');
      var crossWarn = isCross
        ? ' · <span style="color:var(--error);font-weight:600">⚠️ 需跨站换乘：'+escapeHTML(t1.toStation || '')+' → '+escapeHTML(t2.fromStation || '')+'（请自行预留市内交通时间）</span>'
        : '';

      var t1Has = t1.canBuy && hasTicket(t1);
      var t2Has = t2.canBuy && hasTicket(t2);
      var warn = '';
      if (!t1Has && !t2Has) {
        warn = ' · <span style="color:var(--error);font-weight:600">⚠️ 两段均暂无余票</span>';
      } else if (!t1Has) {
        warn = ' · <span style="color:var(--warn);font-weight:600">⚠️ ' + escapeHTML(t1.trainNo) + ' 暂无余票</span>';
      } else if (!t2Has) {
        warn = ' · <span style="color:var(--warn);font-weight:600">⚠️ ' + escapeHTML(t2.trainNo) + ' 暂无余票</span>';
      }

      summaryEl.style.display = '';
      summaryEl.innerHTML = '<span style="font-weight:600">📊 选中方案</span>'
        + ' · <span style="color:var(--accent);font-weight:600">'+escapeHTML(t1.trainNo)+'</span> <span style="color:var(--text2);font-size:.9em">'+escapeHTML(t1.fromStation || '')+'→'+escapeHTML(t1.toStation || '')+'</span> '+escapeHTML(t1.startTime)+'→'+escapeHTML(t1.arriveTime)
        + ' → <span style="color:var(--accent);font-weight:600">'+escapeHTML(t2.trainNo)+'</span> <span style="color:var(--text2);font-size:.9em">'+escapeHTML(t2.fromStation || '')+'→'+escapeHTML(t2.toStation || '')+'</span> '+escapeHTML(t2.startTime)+'→'+escapeHTML(t2.arriveTime)
        + ' · 换乘 <span style="font-weight:600;color:'+gapColor+'">'+gap+'min</span>'
        + ' · 总耗时 <span style="font-weight:600;color:var(--accent3)">'+fmtMinutes(totalDur)+'</span>'
        + ' · 总花费 <span style="font-weight:600;color:var(--accent)">'+pricePfx+totalPrice+'</span>'
        + arriveDayText
        + warn + crossWarn;
    } else if (t1) {
      // 只选了 leg1，提示选择 leg2
      summaryEl.style.display = '';
      summaryEl.innerHTML = '<span style="color:var(--text2)">👆 请在右侧点选第二段车次，查看完整方案的总耗时和总花费</span>';
    } else {
      summaryEl.style.display = 'none';
      summaryEl.innerHTML = '';
    }
  }
}

// 分钟数格式化为 XhYm
function fmtMinutes(mins) {
  if (mins < 0) mins = 0;
  var h = Math.floor(mins / 60);
  var m = mins % 60;
  if (h > 0 && m > 0) return h + 'h' + m + 'm';
  if (h > 0) return h + 'h';
  return m + 'm';
}

// 耗时字符串转分钟数（支持 "4:30"、"28:30"）
function durToMinutes(dur) {
  if (!dur) return 0;
  var p = dur.split(':');
  return (parseInt(p[0]) || 0) * 60 + (parseInt(p[1]) || 0);
}

function renderStrategies(strategies) {
  _currentStrategies = strategies;
  Object.keys(stratState).forEach(function(k){ delete stratState[k]; });

  var el = document.getElementById('strategyList');
  var statsEl = document.getElementById('strategyStats');
  var withTicket = strategies.filter(function(s){
    return (s.trains && s.trains.length > 0) || (s.transferData && s.transferData.length > 0) || (s.segData && s.segData.length > 0) || (s.buyShortData && s.buyShortData.length > 0);
  }).length;

  statsEl.style.display = 'flex';
  statsEl.innerHTML = '<div class="stat-card s-green"><div class="num">'+withTicket+'</div><div class="label">可行方案</div></div>'
    + '<div class="stat-card s-blue"><div class="num">'+strategies.length+'</div><div class="label">策略类型</div></div>';

  var noticeHTML = _transferNotice
    ? '<div class="route-card" style="border-left:3px solid var(--warn);margin-bottom:10px"><div style="padding:12px 16px;font-size:.85em;color:var(--warn);line-height:1.6">⚠️ ' + escapeHTML(_transferNotice) + '</div></div>'
    : '';
  el.innerHTML = noticeHTML + strategies.map(function(s, idx){
    var badgeClass = s.type==='direct'?'badge-direct':s.type==='waitlist'?'badge-transfer':s.type==='transfer'?'badge-direct':'badge-trick';
    var countText = s.trains&&s.trains.length ? s.trains.length+' 个车次'
      : s.transferData ? s.transferData.reduce(function(sum,r){return sum+r.leg1Count+r.leg2Count;},0)+' 趟车次'
      : s.segData ? s.segData.length+' 个方案'
      : s.buyShortData ? s.buyShortData.length+' 个方案' : '需手动操作';

    return '<div class="route-card">'
      + '<div class="route-head" style="cursor:pointer" onclick="toggleStrategy('+idx+')">'
      + '<div class="route-name">'+s.name+'</div>'
      + '<div style="display:flex;align-items:center;gap:8px">'
      + '<div class="route-badge '+badgeClass+'">'+countText+'</div>'
      + '<span id="strat-toggle-'+idx+'" style="font-size:1em;color:var(--text2);transition:transform .2s;display:inline-block">▾</span>'
      + '</div>'
      + '</div>'
      + '<div id="strat-body-'+idx+'">'
      + '<p style="color:var(--text2);font-size:.83em;margin:4px 0">'+s.desc+'</p>'
      + '<div id="strat-card-'+idx+'">'+(function(){ try { return buildStrategyContent(idx, s); } catch(e) { console.error('buildStrategyContent error:', e); return '<div class="tip-box">渲染出错，请刷新重试</div>'; } })()+'</div>'
      + '</div>'
      + '</div>';
  }).join('');
}

// 策略卡片最小化/展开
function toggleStrategy(idx) {
  var body = document.getElementById('strat-body-' + idx);
  var arrow = document.getElementById('strat-toggle-' + idx);
  if (!body || !arrow) return;
  if (body.style.display === 'none') {
    body.style.display = '';
    arrow.style.transform = 'rotate(0deg)';
  } else {
    body.style.display = 'none';
    arrow.style.transform = 'rotate(-90deg)';
  }
}

// Tooltip 定位：确保不溢出视口
function positionTooltip(trigger, content) {
  var rect = trigger.getBoundingClientRect();
  var cw = content.offsetWidth || 200;
  var ch = content.offsetHeight || 80;
  var pad = 8;
  // 默认：居中于触发元素上方
  var left = rect.left + rect.width / 2 - cw / 2;
  var top = rect.top - ch - pad;
  // 上方空间不够 → 放到下方
  if (top < pad) top = rect.bottom + pad;
  // 左侧溢出
  if (left < pad) left = pad;
  // 右侧溢出
  if (left + cw > window.innerWidth - pad) left = window.innerWidth - cw - pad;
  // 下方溢出（兜底）
  if (top + ch > window.innerHeight - pad) top = window.innerHeight - ch - pad;
  content.style.left = left + 'px';
  content.style.top = top + 'px';
}

// ========== 工具 ==========// ========== 工具 ==========
function trainType(no) {
  const p = no.charAt(0).toUpperCase();
  if (p==='G'||p==='C') return 'g';
  if (p==='D') return 'd';
  if (p==='K') return 'k';
  if (p==='Z') return 'z';
  if (p==='T') return 't';
  return 'other';
}

// 常规席位：二等座、硬座、无座（大多数旅客实际购买的席位）
const COMMON_SEATS = ['second', 'hardSeat', 'noSeat'];
// 扩展席位：加上软卧、硬卧（普通列车常用）
const EXTENDED_SEATS = [...COMMON_SEATS, 'softSleep', 'hardSleep'];

function hasTicket(t) {
  if (!t) return false;
  // 先检查常规席位（二等座/硬座/无座）
  for (const k of COMMON_SEATS) {
    const v = t[k];
    if (v && v !== '无' && v !== '--' && v !== '') return true;
  }
  // 高铁/动车检查一等座和商务座
  const tp = trainType(t.trainNo || '');
  if (tp === 'g' || tp === 'd' || tp === 'c') {
    for (const k of ['first', 'business']) {
      const v = t[k];
      if (v && v !== '无' && v !== '--' && v !== '') return true;
    }
  }
  // 普通列车检查卧铺
  for (const k of ['softSleep', 'hardSleep']) {
    const v = t[k];
    if (v && v !== '无' && v !== '--' && v !== '') return true;
  }
  return false;
}

// hasCommonTicket: 只检查常规席位（二等座/硬座/无座），不含商务座/一等座
function hasCommonTicket(t) {
  if (!t) return false;
  for (const k of COMMON_SEATS) {
    const v = t[k];
    if (v && v !== '无' && v !== '--' && v !== '') return true;
  }
  return false;
}

function fmtDur(dur) {
  if (!dur) return '--';
  // 处理中文格式 "4小时30分"、"4小时"、"30分"
  var cnMatch = dur.match(/(\d+)\s*小时(?:(\d+)\s*分)?/);
  if (cnMatch) {
    var ch = parseInt(cnMatch[1]) || 0;
    var cm = parseInt(cnMatch[2]) || 0;
    if (ch > 0 && cm > 0) return ch + 'h' + cm + 'm';
    if (ch > 0) return ch + 'h';
    return cm + 'm';
  }
  // 处理 HH:MM 格式
  var p = dur.split(':');
  if (p.length === 2) {
    var hh = parseInt(p[0], 10), mm = parseInt(p[1], 10);
    if (hh > 0 && mm > 0) return hh + 'h' + mm + 'm';
    if (hh > 0) return hh + 'h';
    return mm + 'm';
  }
  return dur;
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

// ========== 获取有票的席位类型 ==========
function getAvailableSeats(t) {
  const seats = [];
  const checks = [
    {key:'business', label:'商务座'},
    {key:'first', label:'一等座'},
    {key:'second', label:'二等座'},
    {key:'softSleep', label:'软卧'},
    {key:'hardSleep', label:'硬卧'},
    {key:'hardSeat', label:'硬座'},
    {key:'noSeat', label:'无座'},
  ];
  for (const c of checks) {
    const v = t[c.key];
    if (v && v !== '无' && v !== '--' && v !== '') {
      seats.push({label: c.label, count: v});
    }
  }
  return seats;
}

// 生成席位标签HTML
function seatTagsHTML(t) {
  const avail = getAvailableSeats(t);
  if (!avail.length) return '';
  return avail.map(s =>
    `<span style="font-size:.7em;padding:1px 5px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:3px;color:var(--success);margin-left:3px">${s.label}${s.count!=='有'?s.count:''}</span>`
  ).join('');
}

// ========== Init ==========
async function init() {
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  document.getElementById('travelDate').value = tomorrow.toISOString().split('T')[0];
  // Set min date to today
  document.getElementById('travelDate').min = new Date().toISOString().split('T')[0];
  // Set max date to 15 days from now (12306 limit)
  const maxDate = new Date();
  maxDate.setDate(maxDate.getDate() + 15);
  document.getElementById('travelDate').max = maxDate.toISOString().split('T')[0];

  setupStationInput('fromInput','fromDropdown','fromCode');
  setupStationInput('toInput','toDropdown','toCode');
  setupStationInput('viaInput','viaDropdown','viaCode');
  var viaEl = document.getElementById('viaInput');
  if (viaEl) {
    viaEl.addEventListener('input', updateViaUI);
    viaEl.addEventListener('change', updateViaUI);
  }
  updateViaUI();
  await loadStations();
  document.addEventListener('keydown', e => {
    if (e.key==='Enter' && !document.querySelector('.station-dropdown.show')) {
      if (currentTab === 'schedule') querySchedule();
      else doSearch();
    }
  });

  // 回到顶部按钮：滚动超过 400px 时显示
  const backToTopBtn = document.getElementById('backToTop');
  window.addEventListener('scroll', () => {
    backToTopBtn.classList.toggle('show', window.scrollY > 400);
  }, { passive: true });

  // Tooltip JS 定位：hover 时计算位置，避免溢出视口
  document.addEventListener('mouseover', function(e) {
    var tipEl = e.target.closest('.price-tip');
    if (!tipEl) return;
    var content = tipEl.querySelector('.tip-content');
    if (!content) return;
    content.style.display = 'block';
    positionTooltip(tipEl, content);
  });
  document.addEventListener('mouseout', function(e) {
    var tipEl = e.target.closest('.price-tip');
    if (!tipEl) return;
    var content = tipEl.querySelector('.tip-content');
    if (content) content.style.display = 'none';
  });
}
init();
</script>
<script>
/* 阅读设置：字号滑块 + 老年人模式（localStorage 持久化） */
(function () {
  var root = document.documentElement;
  var body = document.body;
  var range = document.getElementById('fontRange');
  var valEl = document.getElementById('fontVal');
  var elder = document.getElementById('elderMode');
  if (!range || !valEl || !elder) return;

  var KF = 'piaolu_font_px', KE = 'piaolu_elder';
  var MIN = 16, MAX = 24, DEF = 18, ELDER_PX = 26;

  var cur = parseInt(localStorage.getItem(KF) || DEF, 10);
  if (!(cur >= MIN && cur <= MAX)) cur = DEF;
  var elderOn = localStorage.getItem(KE) === '1';

  function paint() {
    valEl.textContent = elderOn ? '超大' : cur;
    range.value = cur;
    range.disabled = elderOn;
    elder.checked = elderOn;
    body.classList.toggle('elder', elderOn);
    root.style.fontSize = (elderOn ? ELDER_PX : cur) + 'px';
  }

  range.addEventListener('input', function () {
    cur = parseInt(range.value, 10);
    try { localStorage.setItem(KF, cur); } catch (e) {}
    paint();
  });

  elder.addEventListener('change', function () {
    elderOn = elder.checked;
    try { localStorage.setItem(KE, elderOn ? '1' : '0'); } catch (e) {}
    paint();
  });

  paint();
})();

/* 列表布局：单列 / 双列（localStorage 持久化，默认单列） */
(function () {
  var body = document.body;
  var btns = document.querySelectorAll('.layout-btn');
  if (!btns.length) return;
  var KEY = 'piaolu_cols';
  var cols = localStorage.getItem(KEY) === '2' ? 2 : 1;

  function paint() {
    body.classList.toggle('two-col', cols === 2);
    for (var i = 0; i < btns.length; i++) {
      var on = parseInt(btns[i].getAttribute('data-cols'), 10) === cols;
      btns[i].classList.toggle('active', on);
      btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () {
      cols = parseInt(this.getAttribute('data-cols'), 10);
      try { localStorage.setItem(KEY, cols); } catch (e) {}
      paint();
    });
  }
  paint();
})();
</script>
